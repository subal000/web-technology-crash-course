<script>
const SEC = [{"day": "START", "items": [{"kind": "info", "title": "JavaScript, and how to run it", "level": "Start", "type": "info", "explain": "<h3>HTML builds it. CSS styles it. JavaScript makes it think.</h3><p>JavaScript is <b>behaviour</b>: it makes pages react, remember, and change. Today is the <b>language itself</b>, and the fastest place to try it needs no files, the <b>browser console</b>.</p><p><b>Open it now:</b> <code>F12</code> (or right-click &rarr; Inspect) &rarr; <b>Console</b> tab. Type JavaScript, press Enter, it runs instantly.</p><p>Your flashlight is <code>console.log()</code>, it prints a value so you can see it. <b>Type every example into your own console</b>, and do the “Your turn” challenges under each lesson. The editor here runs your code and shows anything you <code>console.log()</code> in the dark console strip.</p><p>We'll go from printing text all the way to arrays of objects, the exact shape your Task Manager uses. Take your time; this is the day everything else builds on.</p>"}]}, {"day": "FIRST STEPS", "items": [{"kind": "lesson", "title": "1 · console.log & comments", "level": "Beginner", "type": "js", "explain": "<code>console.log()</code> prints whatever you put in the brackets, and you can pass several values separated by commas. There are cousins too: <code>console.warn()</code> (yellow) and <code>console.error()</code> (red) in real DevTools. <b>Comments</b> are notes JS ignores: <code>//</code> for one line, <code>/* ... */</code> for many. Use them to explain code, or to temporarily switch a line off.", "code": "console.log(\"Hello, world!\");\nconsole.log(\"Two\", \"values\", 3 + 4);\nconsole.warn(\"a warning\");\nconsole.error(\"an error\");\n\n// this line is ignored\n/* so is\n   this block */", "practice": ["Add a <code>console.log</code> that prints your own name.", "Print three different values in one <code>console.log</code>, separated by commas.", "Comment out the <code>console.error</code> line, then run again."], "gotcha": "In files only <code>console.log</code> shows on-page here, but in real DevTools <code>warn</code>/<code>error</code> show coloured. Comments never run."}, {"kind": "lesson", "title": "2 · Variables: let, const, var", "level": "Beginner", "type": "js", "explain": "A variable is a <b>named box</b> for a value. Three ways to declare one:<br>&bull; <code>const</code>, cannot be reassigned. <b>Use this by default.</b><br>&bull; <code>let</code>, can change later. Use when the value must change.<br>&bull; <code>var</code>, the old way; <b>avoid it</b> (confusing scope), but you'll see it in old code.<br><b>Naming:</b> start with a letter/<code>$</code>/<code>_</code>, use <code>camelCase</code> (<code>myAge</code>), case-sensitive, no reserved words.", "code": "const name = \"Subal\";\nlet score = 0;\n\nscore = 10;          // let can change\nscore = score + 5;   // now 15\nconsole.log(name, score);\n\nlet isLoggedIn = true;\nlet userAge = 21;\nconsole.log(userAge, isLoggedIn);", "practice": ["Make a <code>const</code> for your city and log it.", "Create <code>let count = 1</code>, then add 1 to it twice, logging each time.", "Try reassigning your <code>const</code> (e.g. <code>name = \"x\"</code>) and read the error."], "gotcha": "<code>const</code> blocks <b>reassignment</b> of the name. Prefer it; reach for <code>let</code> only when the value genuinely changes. Skip <code>var</code>."}, {"kind": "lesson", "title": "3 · Data types & typeof", "level": "Beginner", "type": "js", "explain": "Every value has a <b>type</b>. The ones you'll meet:<br>&bull; <b>String</b>, text in <code>\"...\"</code>, <code>'...'</code>, or <code>`...`</code><br>&bull; <b>Number</b>, <code>42</code>, <code>3.14</code> (no separate int/float)<br>&bull; <b>Boolean</b>, <code>true</code> / <code>false</code><br>&bull; <b>Undefined</b>, a variable with no value yet<br>&bull; <b>Null</b>, a deliberate “empty”<br>Check any value with <code>typeof</code>.", "code": "let text = \"hello\";\nlet num = 42;\nlet yes = true;\nlet empty = null;\nlet notSet;\n\nconsole.log(typeof text);   // string\nconsole.log(typeof num);    // number\nconsole.log(typeof yes);    // boolean\nconsole.log(typeof notSet); // undefined", "practice": ["Log the <code>typeof</code> a number, a string, and a boolean.", "Make a variable with no value and log its type.", "Put a number in quotes (<code>\"42\"</code>) and check its <code>typeof</code>, surprise!"], "gotcha": "<code>\"42\"</code> (quotes) is a <b>string</b>, not a number. <code>typeof null</code> returns <code>\"object\"</code>, a famous old bug; just remember null means “empty on purpose.”"}]}, {"day": "WORKING WITH VALUES", "items": [{"kind": "lesson", "title": "4 · Strings", "level": "Beginner", "type": "js", "explain": "Join strings with <code>+</code>, or better, use a <b>template literal</b>: backticks with <code>${ }</code> to drop values inside. Handy string tools:<br>&bull; <code>.length</code>, character count<br>&bull; <code>.toUpperCase()</code> / <code>.toLowerCase()</code><br>&bull; <code>.includes(\"x\")</code>, contains?<br>&bull; <code>.slice(start, end)</code>, cut a piece<br>&bull; <code>.trim()</code>, remove edge spaces<br>&bull; <code>.replace(\"a\", \"b\")</code> &nbsp; <code>.split(\",\")</code>, into an array<br>Characters are indexed from 0: <code>text[0]</code> is the first.", "code": "let first = \"Subal\", last = \"Ghimire\";\n\nconsole.log(first + \" \" + last);            // concat\nconsole.log(`Hello, ${first} ${last}!`);    // template literal\n\nconsole.log(first.length);       // 5\nconsole.log(first.toUpperCase());\nconsole.log(first.includes(\"ub\"));\nconsole.log(first.slice(0, 3));  // \"Sub\"\nconsole.log(\"  hi  \".trim());", "practice": ["Join two string variables with a template literal.", "Log the <code>.length</code> of your full name.", "Turn a lowercase word UPPERCASE, then check if it <code>.includes</code> a letter."], "gotcha": "Strings are <b>immutable</b>, methods return a <b>new</b> string. <code>name.toUpperCase()</code> doesn't change <code>name</code> unless you reassign it."}, {"kind": "lesson", "title": "5 · Numbers & Math", "level": "Beginner", "type": "js", "explain": "Arithmetic: <code>+ - * /</code> and <code>%</code> (remainder). Order follows maths (brackets first). The <code>Math</code> object helps:<br>&bull; <code>Math.round()</code>, <code>Math.floor()</code>, <code>Math.ceil()</code><br>&bull; <code>Math.random()</code>, 0 to just under 1<br>&bull; <code>Math.max()</code>, <code>Math.min()</code><br>Convert text to number with <code>Number(\"5\")</code> or <code>parseInt()</code>. Fix decimals with <code>.toFixed(2)</code>.", "code": "console.log(7 + 3, 7 - 3, 7 * 3, 7 / 3);\nconsole.log(10 % 3);            // remainder = 1\n\nconsole.log(Math.round(4.6));   // 5\nconsole.log(Math.floor(4.9));   // 4\nconsole.log(Math.max(3, 9, 2)); // 9\n\nconsole.log(Number(\"25\") + 5);          // 30\nconsole.log((3.14159).toFixed(2));      // \"3.14\"", "practice": ["Calculate and log <code>15 % 4</code>.", "Roll a dice: <code>Math.floor(Math.random() * 6) + 1</code>, run it a few times.", "Convert the string <code>\"100\"</code> to a number and add 50."], "gotcha": "<code>\"5\" + 3</code> gives <code>\"53\"</code> (glue!), but <code>\"5\" - 3</code> gives <code>2</code>. Always <code>Number()</code> your inputs before maths."}, {"kind": "lesson", "title": "6 · Operators", "level": "Beginner", "type": "js", "explain": "Four families:<br>&bull; <b>Arithmetic</b>: <code>+ - * / %</code><br>&bull; <b>Assignment</b>: <code>=</code> and shortcuts <code>+= -= *=</code> (<code>x += 5</code> means <code>x = x + 5</code>)<br>&bull; <b>Comparison</b>: <code>=== !== &gt; &lt; &gt;= &lt;=</code>, give <code>true</code>/<code>false</code><br>&bull; <b>Logical</b>: <code>&&</code> (and), <code>||</code> (or), <code>!</code> (not)<br>Use <code>===</code>, not <code>==</code>. Logical operators combine conditions.", "code": "let score = 10;\nscore += 5;   // 15\nscore *= 2;   // 30\nconsole.log(score);\n\nconsole.log(5 === 5, 5 === \"5\");   // true, false\nconsole.log(10 > 3, 10 <= 9);\n\nlet age = 20;\nconsole.log(age > 18 && age < 65); // true\nconsole.log(age < 13 || age > 60); // false\nconsole.log(!true);                // false", "practice": ["Start <code>let x = 100</code>, use <code>-=</code> to subtract 20, log it.", "Compare <code>7 !== \"7\"</code> and log the result.", "Use <code>&&</code> to check whether a number is between 10 and 20."], "gotcha": "<code>===</code> checks value <b>and</b> type. <code>&&</code> needs both sides true; <code>||</code> needs just one; <code>!</code> flips it."}]}, {"day": "MAKING DECISIONS", "items": [{"kind": "lesson", "title": "7 · if / else if / else", "level": "Beginner", "type": "js", "explain": "Run code based on a condition. <code>if</code> runs when its condition is true; <code>else if</code> checks another; <code>else</code> catches the rest. Condition in <code>( )</code>, block in <code>{ }</code>. The condition is anything truthy/falsy, usually a comparison.", "code": "let marks = 72;\n\nif (marks >= 80) {\n  console.log(\"Distinction\");\n} else if (marks >= 40) {\n  console.log(\"Pass\");\n} else {\n  console.log(\"Fail\");\n}", "practice": ["Change <code>marks</code> and rerun to hit each branch.", "Write an <code>if</code> that logs “adult” if age &gt;= 18, else “minor”.", "Add an <code>else if</code> for a middle case of your own."], "gotcha": "Use <code>===</code> for equality inside conditions. Falsy values: <code>0</code>, <code>\"\"</code>, <code>null</code>, <code>undefined</code>, <code>false</code>, everything else is truthy."}, {"kind": "lesson", "title": "8 · Ternary & switch", "level": "Beginner", "type": "js", "explain": "Two shortcuts:<br>&bull; <b>Ternary</b>, a one-line if/else: <code>condition ? ifTrue : ifFalse</code>. Great for quick assignments.<br>&bull; <b>switch</b>, cleaner than many <code>else if</code>s when checking one value against many options. Each <code>case</code> ends with <code>break</code>; <code>default</code> is the fallback.", "code": "let age = 20;\nlet type = age >= 18 ? \"adult\" : \"minor\";\nconsole.log(type);\n\nlet day = \"Sat\";\nswitch (day) {\n  case \"Sat\":\n  case \"Sun\":\n    console.log(\"Weekend\");\n    break;\n  default:\n    console.log(\"Weekday\");\n}", "practice": ["Write a ternary that logs “even” or “odd” for a number (<code>n % 2 === 0</code>).", "Add a <code>case \"Fri\"</code> that logs “Almost weekend”.", "Change <code>day</code> to test each branch."], "gotcha": "Don't forget <code>break;</code>, without it, execution “falls through” to the next case. Stacking cases (Sat/Sun) with no break is a deliberate trick."}]}, {"day": "REPEATING (LOOPS)", "items": [{"kind": "lesson", "title": "9 · for, while, do...while", "level": "Beginner", "type": "js", "explain": "Loops repeat code. Three counting loops:<br>&bull; <code>for</code>, when you know how many times: <code>for (start; condition; step)</code>.<br>&bull; <code>while</code>, repeat <b>while</b> a condition stays true (checks first).<br>&bull; <code>do...while</code>, same, but always runs <b>at least once</b> (checks after).", "code": "// for\nfor (let i = 1; i <= 3; i++) {\n  console.log(\"for\", i);\n}\n\n// while\nlet n = 3;\nwhile (n > 0) {\n  console.log(\"while\", n);\n  n--;\n}\n\n// do...while (runs at least once)\nlet x = 0;\ndo {\n  console.log(\"do\", x);\n  x++;\n} while (x < 2);", "practice": ["Write a <code>for</code> loop that logs 1 to 10.", "Log only even numbers to 20 (use <code>i += 2</code>).", "Rewrite one of your <code>for</code> loops as a <code>while</code> loop."], "gotcha": "Always change the loop variable (<code>i++</code>, <code>n--</code>) or the condition never ends, an <b>infinite loop</b> that freezes the tab (close it if it happens)."}, {"kind": "lesson", "title": "10 · for...of, for...in, break & continue", "level": "Beginner", "type": "js", "explain": "Two loops made for collections, plus two controls:<br>&bull; <code>for...of</code>, loop over each <b>value</b> in an array (cleanest for arrays).<br>&bull; <code>for...in</code>, loop over the <b>keys</b> of an object.<br>&bull; <code>break</code>, stop the loop early.<br>&bull; <code>continue</code>, skip to the next turn.", "code": "let fruits = [\"apple\", \"banana\", \"mango\"];\nfor (const fruit of fruits) {\n  console.log(fruit);\n}\n\nlet person = { name: \"Subal\", age: 21 };\nfor (const key in person) {\n  console.log(key, \"=\", person[key]);\n}\n\nfor (let i = 1; i <= 5; i++) {\n  if (i === 3) continue;  // skip 3\n  if (i === 5) break;     // stop before 5\n  console.log(i);\n}", "practice": ["Use <code>for...of</code> to log each item in your own array.", "Use <code>for...in</code> to log every key of an object.", "Add a <code>continue</code> that skips even numbers in a 1–10 loop."], "gotcha": "<code>for...of</code> gives you <b>values</b> (arrays). <code>for...in</code> gives you <b>keys</b> (objects). Swapping them is a common mistake."}]}, {"day": "FUNCTIONS", "items": [{"kind": "lesson", "title": "11 · Functions", "level": "Beginner", "type": "js", "explain": "A function is a <b>reusable machine</b>, inputs go in, a job runs, a value can come back. Two ways to write one:<br>&bull; <b>Declaration</b>: <code>function add(a, b) { ... }</code><br>&bull; <b>Arrow</b>: <code>const add = (a, b) => { ... }</code> (modern, shorter)<br><b>Parameters</b> are the inputs; <code>return</code> sends a value out; <b>default parameters</b> give a fallback. A function only runs when <b>called</b> with <code>()</code>.", "code": "// declaration\nfunction add(a, b) {\n  return a + b;\n}\nconsole.log(add(2, 3));\n\n// arrow function\nconst square = (n) => n * n;\nconsole.log(square(5));\n\n// default parameter\nfunction greet(name = \"friend\") {\n  return `Hi, ${name}`;\n}\nconsole.log(greet());\nconsole.log(greet(\"Subal\"));", "practice": ["Write a function that returns two numbers multiplied.", "Write an <b>arrow</b> function that returns a number doubled.", "Add a default parameter and call the function with no argument."], "gotcha": "<code>return</code> ends the function <b>and</b> hands back the value. No <code>return</code> = the function gives <code>undefined</code>. Defining ≠ calling (<code>()</code> runs it)."}]}, {"day": "DATA: LISTS & OBJECTS", "items": [{"kind": "lesson", "title": "12 · Arrays", "level": "Beginner", "type": "js", "explain": "An array is an ordered list in <code>[ ]</code>, accessed by <b>index from 0</b>. Core methods:<br>&bull; <code>.push()</code> add end &bull; <code>.pop()</code> remove end<br>&bull; <code>.unshift()</code> add start &bull; <code>.shift()</code> remove start<br>&bull; <code>.length</code> count &bull; <code>.indexOf()</code> position<br>&bull; <code>.includes()</code> present? &bull; <code>.join(\", \")</code> to a string", "code": "let todos = [\"eat\", \"code\", \"sleep\"];\n\nconsole.log(todos[0]);        // eat\nconsole.log(todos.length);    // 3\n\ntodos.push(\"repeat\");         // add end\ntodos.pop();                  // remove end\ntodos.unshift(\"wake\");        // add start\nconsole.log(todos);\n\nconsole.log(todos.includes(\"code\"));\nconsole.log(todos.join(\" -> \"));", "practice": ["Make an array of 4 hobbies and log the 2nd one.", "<code>push</code> a new item, then <code>pop</code> it off, log after each.", "Use <code>.join(\", \")</code> to print your array as a sentence."], "gotcha": "Indexes start at 0 (first = <code>[0]</code>, last = <code>[length - 1]</code>). <code>push/pop/shift/unshift</code> change the <b>original</b> array."}, {"kind": "lesson", "title": "13 · Array methods: forEach, map, filter, find, reduce", "level": "Intermediate", "type": "js", "explain": "Work through arrays without manual loops, each takes a function:<br>&bull; <code>forEach</code>, do something with each item (no new array)<br>&bull; <code>map</code>, build a <b>new</b> array by transforming each<br>&bull; <code>filter</code>, new array of items that pass a test<br>&bull; <code>find</code>, the <b>first</b> item that matches<br>&bull; <code>reduce</code>, boil the array down to one value (a total)", "code": "let nums = [1, 2, 3, 4, 5];\n\nnums.forEach((n) => console.log(\"item\", n));\n\nlet doubled = nums.map((n) => n * 2);\nconsole.log(doubled);   // [2,4,6,8,10]\n\nlet evens = nums.filter((n) => n % 2 === 0);\nconsole.log(evens);     // [2,4]\n\nconsole.log(nums.find((n) => n > 3));            // 4\nconsole.log(nums.reduce((sum, n) => sum + n, 0));// 15", "practice": ["Use <code>map</code> to make an array of each number squared.", "Use <code>filter</code> to keep only numbers greater than 2.", "Use <code>reduce</code> to add up an array of prices."], "gotcha": "<code>map</code>/<code>filter</code> <b>return</b> a new array, store it in a variable. <code>forEach</code> returns nothing. <code>reduce</code>'s <code>0</code> is the starting total."}, {"kind": "lesson", "title": "14 · Objects", "level": "Beginner", "type": "js", "explain": "An object groups related data as <b>key: value</b> pairs in <code>{ }</code>. Read with a dot (<code>person.name</code>) or brackets (<code>person[\"name\"]</code>, needed when the key is in a variable). Add/change keys any time. <code>Object.keys()</code> / <code>Object.values()</code> list them.", "code": "let task = {\n  title: \"Learn JS\",\n  done: false,\n  priority: 2,\n};\n\nconsole.log(task.title);        // dot\nconsole.log(task[\"priority\"]);  // bracket\n\ntask.done = true;               // change\ntask.tags = [\"study\"];          // add key\n\nconsole.log(Object.keys(task));\nconsole.log(Object.values(task));", "practice": ["Make an object describing you (name, age, city); log each with dot access.", "Add a new key <b>after</b> creating the object.", "Change one value, then log the whole object."], "gotcha": "Keys are case-sensitive, use the exact name (<code>task.title</code>, not <code>task.Title</code>). Use brackets when the key is stored in a variable: <code>obj[myVar]</code>."}, {"kind": "lesson", "title": "15 · Arrays of objects", "level": "Intermediate", "type": "js", "explain": "The most common real-world shape: a <b>list where each item is an object</b>, exactly how you'll store tasks, users, products. Loop with <code>forEach</code>/<code>map</code>, search with <code>filter</code>, read each item's properties. <b>This is your Task Manager's data.</b>", "code": "let tasks = [\n  { title: \"Eat\", done: true },\n  { title: \"Code\", done: false },\n  { title: \"Sleep\", done: false },\n];\n\ntasks.forEach((t) => console.log(t.title, t.done));\n\nlet todo = tasks.filter((t) => t.done === false);\nconsole.log(todo);\n\nlet titles = tasks.map((t) => t.title);\nconsole.log(titles);\n\ntasks.push({ title: \"Repeat\", done: false });\nconsole.log(tasks.length);", "practice": ["Make an array of 3 task objects (<code>title</code> + <code>done</code>).", "<code>filter</code> to show only the ones where <code>done</code> is true.", "Use <code>map</code> to get an array of just the titles."], "gotcha": "This array-of-objects <b>is</b> the Task Manager. Everything here, add, filter, loop, you'll reuse on Day 7."}]}];
const flat=[];SEC.forEach(s=>s.items.forEach(it=>flat.push({...it,day:s.day})));
const nav=document.getElementById("nav"),editor=document.getElementById("editor"),output=document.getElementById("output"),
  lessonTitle=document.getElementById("lessonTitle"),lessonBadge=document.getElementById("lessonBadge"),lessonExplain=document.getElementById("lessonExplain"),
  progress=document.getElementById("progress"),workspace=document.getElementById("workspace"),runBtn=document.getElementById("runBtn"),
  resetBtn=document.getElementById("resetBtn"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),runHint=document.getElementById("runHint"),
  codeLabel=document.getElementById("codeLabel");
let current=0,debounce=null;
SEC.forEach(s=>{const label=document.createElement("div");label.className="group-label";label.textContent=s.day;nav.appendChild(label);
  s.items.forEach(it=>{const idx=flat.findIndex(f=>f.title===it.title&&f.day===s.day&&f.explain===it.explain);
    const btn=document.createElement("button");btn.className="nav-item"+(it.kind==="info"?" info":"");btn.dataset.idx=idx;
    btn.innerHTML='<i class="dot d-'+it.level+'"></i>'+it.title+(it.optional?' <span class="opt-tag">opt</span>':'');btn.addEventListener("click",()=>load(idx));nav.appendChild(btn);});});

const CAP='<scr'+'ipt>(function(){var b=[],el=null;function f(v){if(v===null)return "null";if(v===undefined)return "undefined";if(typeof v==="function")return "[function]";if(typeof v==="object"){try{return JSON.stringify(v);}catch(e){return String(v);}}return String(v);}function o(c,a){var s=[].map.call(a,f).join(" ");if(el){var d=document.createElement("div");if(c)d.className=c;d.textContent=s;el.appendChild(d);}else b.push([c,s]);}console.log=function(){o("",arguments);};console.info=console.log;console.error=function(){o("e",arguments);};console.warn=function(){o("w",arguments);};window.addEventListener("error",function(e){o("e",[e.message]);});document.addEventListener("DOMContentLoaded",function(){el=document.getElementById("__con");b.forEach(function(x){var d=document.createElement("div");if(x[0])d.className=x[0];d.textContent=x[1];el.appendChild(d);});b=[];});})();<\/scr'+'ipt>';
const FSTYLE='<style>body{font-family:-apple-system,sans-serif;margin:0;color:#1b1b28}#app{padding:14px}#app:empty{display:none}#__wrap{border-top:1px solid #2a2a3a}#__lbl{background:#12121a;color:#8a8a98;font:600 10px monospace;letter-spacing:.12em;padding:5px 12px}#__con{background:#1e1e2e;color:#e6e6f0;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;padding:8px 12px;white-space:pre-wrap;min-height:34px;line-height:1.55}#__con div{padding:1px 0}#__con .e{color:#ff6b6b}#__con .w{color:#fbbf24}</style>';
function frameDoc(bodyHtml,jsCode){
  var app='<div id="app">'+(bodyHtml||'')+'</div>';
  var box='<div id="__wrap"><div id="__lbl">&#9656; CONSOLE</div><div id="__con"></div></div>';
  var js=jsCode?('<scr'+'ipt>try{\n'+jsCode+'\n}catch(e){console.error(e.message);}<\/scr'+'ipt>'):'';
  return FSTYLE+CAP+app+box+js;
}
function setFrame(doc){output.innerHTML="";var f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-same-origin");output.appendChild(f);f.srcdoc=doc;}
function runJS(code){setFrame(frameDoc("",code));}
function runHTML(code){if(/<!doctype|<html[\s>]/i.test(code)){setFrame(code);}else{setFrame(frameDoc(code,""));}}
function runCurrent(){const it=flat[current];if(it.type==="js")runJS(editor.value);else if(it.type==="html")runHTML(editor.value);}
function load(idx){current=idx;const it=flat[idx];lessonTitle.textContent=it.title;lessonBadge.textContent=it.level;lessonBadge.className="badge-level b-"+it.level;
  let ex=it.explain;
  if(it.optional)ex='<div class="opt-banner"><b>Optional \u00b7 self-study.</b> Not needed for the projects yet. Skip if short on time, or explore on your own.</div>'+ex;
  if(it.practice&&it.practice.length){var where=it.type==="js"?"Type it in your console (F12 \u2192 Console), run each, then make these changes:":"Build it in your <code>index.html</code> + <code>script.js</code> (or edit below), then try these:";ex+='<div class="practice"><div class="pt">\u25b6 Your turn</div><div class="pw">'+where+'</div><ol><li>'+it.practice.join("</li><li>")+'</li></ol></div>';}
  if(it.gotcha)ex+='<div class="gotcha"><b>Gotcha:</b> '+it.gotcha+"</div>";
  lessonExplain.innerHTML=ex;
  progress.textContent=(idx+1)+" / "+flat.length+"  \u00B7  "+it.day;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",Number(b.dataset.idx)===idx));
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===flat.length-1;
  if(it.kind==="info"){workspace.style.display="none";}else{workspace.style.display="grid";editor.value=it.code;codeLabel.textContent=(it.type==="js"?"JavaScript":"HTML + script")+" \u00b7 edit me";runHint.textContent="Ctrl/Cmd+Enter to run";runCurrent();}
  document.querySelector(".content").scrollTop=0;}
editor.addEventListener("input",()=>{if(flat[current].kind==="info")return;clearTimeout(debounce);debounce=setTimeout(runCurrent,400);});
editor.addEventListener("keydown",(e)=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCurrent();}if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);editor.selectionStart=editor.selectionEnd=s+2;}});
runBtn.addEventListener("click",runCurrent);resetBtn.addEventListener("click",()=>{editor.value=flat[current].code;runCurrent();});
prevBtn.addEventListener("click",()=>{if(current>0)load(current-1);});nextBtn.addEventListener("click",()=>{if(current<flat.length-1)load(current+1);});
load(0);
</script></body></html>
