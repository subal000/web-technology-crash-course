<script>
const SEC = [{"day": "START", "items": [{"kind": "info", "title": "From the console to the page", "level": "Start", "type": "info", "explain": "<h3>Yesterday: the language. Today: the page.</h3><p>Yesterday you learned JavaScript in the console. Today JS reaches into your HTML and changes what's on screen, this is the <b>DOM</b>, the browser's live version of your page.</p><p>We'll build up gently, one step at a time:</p><p><b>First</b> (lessons 1–3), we'll <b>read and change</b> the page, and every change will happen the moment the page loads.<br><b>Then</b> (lesson 4 onward), we'll learn to make things happen <b>when the user clicks or types</b>, that's where it becomes a real app.<br><b>Finally</b>, we build a working Task Manager together.</p><p><b>Set up real files:</b> in VS Code make a folder, create <code>index.html</code> and <code>script.js</code>, link them just before <code>&lt;/body&gt;</code> with <code>&lt;script src=\"script.js\"&gt;&lt;/script&gt;</code>, and keep the console (F12) open. Build every example in your own files and do the “Your turn” tasks. No rush, we go one idea at a time.</p>"}]}, {"day": "PART 1 · READING & CHANGING THE PAGE", "items": [{"kind": "lesson", "title": "1 · Selecting an element", "level": "Beginner", "type": "html", "explain": "Before JavaScript can change anything, it has to <b>find</b> the element first, the same way you'd point at something before picking it up. The main tool is <code>document.querySelector(\"...\")</code>, and it uses the <b>CSS selectors you already know</b>:<br>&bull; <code>\"#id\"</code> for an id &bull; <code>\".class\"</code> for a class &bull; <code>\"p\"</code> for a tag<br>It hands back the element, so save it in a variable. (<code>querySelectorAll</code> gets <b>all</b> matches as a list.)<br><br>Right now we're just <b>finding and reading</b>, no changing yet.<br><br><b>One you'll see everywhere:</b> there's an older way to grab an element by id, <code>document.getElementById(\"title\")</code>, note: <b>no <code>#</code></b>, just the id name. It does the same job as <code>querySelector(\"#title\")</code>. Nearly every tutorial and older codebase online uses it, so it's worth recognising. We'll stick with <code>querySelector</code> because one tool handles ids, classes, and tags, but now <code>getElementById</code> won't throw you when you meet it.", "code": "<h1 id=\"title\">Hello there</h1>\n<p class=\"note\">One</p>\n<p class=\"note\">Two</p>\n\n<script>\n  const title = document.querySelector(\"#title\");\n  const notes = document.querySelectorAll(\".note\");\n\n  // older way, same result (no # here):\n  const sameTitle = document.getElementById(\"title\");\n\n  console.log(title.textContent);        // \"Hello there\"\n  console.log(sameTitle.textContent);    // same thing\n  console.log(\"notes found:\", notes.length);\n<\/script>", "practice": ["Select the <code>h1</code> by its id and log its <code>textContent</code>.", "Use <code>querySelectorAll(\".note\")</code> and log how many it found.", "Add a third <code>&lt;p class=\"note\"&gt;</code> in the HTML and rerun, the count goes up.", "Grab the heading with <code>getElementById(\"title\")</code> (no <code>#</code>) and log its text, same result."], "gotcha": "<code>querySelector</code> uses CSS syntax (<code>#</code> id, <code>.</code> class); <code>getElementById</code> takes the <b>bare id, no <code>#</code></b>. Both return <code>null</code> if nothing matches, a common cause of errors. When in doubt, use <code>querySelector</code>: one tool for everything."}, {"kind": "lesson", "title": "2 · Changing what's on the page", "level": "Beginner", "type": "html", "explain": "Now that we can grab an element, we can <b>change it</b>. Set <code>.textContent</code> to swap its text, or <code>.innerHTML</code> to put HTML tags inside.<br><br><b>Watch closely:</b> in the example, the heading is already changed before you touch anything. That's because <b>the script runs the instant the page loads</b>, top to bottom, once. You didn't click, it just ran. Hold that thought, in a few lessons we'll make changes wait for a click instead.", "code": "<h1 id=\"title\">Original heading</h1>\n<p id=\"msg\">Original text</p>\n\n<script>\n  // this runs by itself the moment the page loads\n  document.querySelector(\"#title\").textContent = \"Changed by JavaScript!\";\n  document.querySelector(\"#msg\").innerHTML = \"Now with <b>bold</b> text.\";\n<\/script>", "practice": ["Change the heading's <code>textContent</code> to your own name.", "Use <code>innerHTML</code> to put an <code>&lt;em&gt;italic&lt;/em&gt;</code> word in the paragraph.", "Set <code>textContent</code> to <code>\"&lt;b&gt;hi&lt;/b&gt;\"</code>, notice the tags show as plain text, not bold."], "gotcha": "<code>textContent</code> = plain text (safe, use this most). <code>innerHTML</code> = real HTML tags (handy, but never use it with text a user typed)."}, {"kind": "lesson", "title": "3 · Changing style, classes & attributes", "level": "Beginner", "type": "html", "explain": "Three more things you can change on an element, all still running <b>on load</b> for now:<br>&bull; <b>Style:</b> <code>.style.color</code>, <code>.style.fontSize</code>, etc. Property names are <b>camelCase</b> (<code>backgroundColor</code>, not <code>background-color</code>).<br>&bull; <b>Classes:</b> <code>.classList.add(\"x\")</code> / <code>.remove(\"x\")</code> / <code>.toggle(\"x\")</code>, the clean way to apply CSS you already wrote.<br>&bull; <b>Attributes:</b> <code>.src</code> for an image, <code>.value</code> for an input, or <code>.setAttribute(\"name\", \"value\")</code>.", "code": "<style> .box { padding: 12px; border: 2px solid purple; border-radius: 8px; } </style>\n<p id=\"p\">Style me</p>\n<img id=\"pic\" src=\"https://picsum.photos/90\" alt=\"\">\n\n<script>\n  const p = document.querySelector(\"#p\");\n  p.style.color = \"purple\";\n  p.style.fontSize = \"22px\";\n  p.classList.add(\"box\");        // applies the .box CSS\n\n  document.querySelector(\"#pic\").src = \"https://picsum.photos/90?2\";\n<\/script>", "practice": ["Set the paragraph's <code>.style.color</code> and <code>.style.fontSize</code>.", "Add a <code>.box</code> class to it with <code>classList.add</code>.", "Change the image's <code>.src</code> to <code>\"https://picsum.photos/90?5\"</code>."], "gotcha": "In JS, CSS names are <b>camelCase</b>: <code>fontSize</code>, <code>backgroundColor</code>. Prefer adding a <b>class</b> over lots of <code>.style</code> lines, keep the real styling in your CSS file."}]}, {"day": "PART 2 · REACTING TO THE USER", "items": [{"kind": "lesson", "title": "4 · Your first event: click", "level": "Beginner", "type": "html", "explain": "<h3>The big shift: make things happen <i>when the user acts</i>.</h3>Everything so far ran <b>once, on load</b>. But real pages <b>wait for you</b>, something happens <b>when</b> you click, type, or submit. That “when X happens, do Y” is an <b>event listener</b>, and it's the heart of every interactive page.<br><br><code>addEventListener</code> needs two things: the <b>event to wait for</b> (a word in quotes, like <code>\"click\"</code>) and a <b>function to run</b> when it happens. Read it as a sentence:<br><br><code>button.addEventListener(\"click\", () =&gt; { ... })</code><br><span style='color:#6a6a7d'>&nbsp;&nbsp;&nbsp;who to watch&nbsp;&nbsp;·&nbsp;&nbsp;wait for a click&nbsp;&nbsp;·&nbsp;&nbsp;then run these instructions</span><br><br>The function (a little arrow function) holds the code that runs <b>later</b>, at the moment of the click, <b>not now</b>. So nothing happens until you actually click.", "code": "<h1 id=\"title\">Nothing clicked yet</h1>\n<button id=\"btn\">Click me</button>\n\n<script>\n  const title = document.querySelector(\"#title\");\n  const btn = document.querySelector(\"#btn\");\n\n  // \"Hey button: when a click happens, run this.\"\n  btn.addEventListener(\"click\", () => {\n    title.textContent = \"You clicked the button!\";\n  });\n<\/script>", "practice": ["Change the message it shows on click to something of your own.", "Also change the title's colour inside the same click (<code>title.style.color = \"green\"</code>).", "Add a <b>second</b> button that changes the heading to a different message."], "gotcha": "Pass the function <b>without calling it</b>: <code>addEventListener(\"click\", () =&gt; {...})</code>. If you accidentally write <code>()</code> after a named function, it runs immediately instead of waiting for the click."}, {"kind": "lesson", "title": "5 · More events & the event object", "level": "Beginner", "type": "html", "explain": "<code>\"click\"</code> is just one event. Others you'll use:<br>&bull; <code>\"input\"</code>, fires every time the user <b>types</b> in a box<br>&bull; <code>\"submit\"</code>, when a form is submitted<br>&bull; <code>\"keydown\"</code>, a key is pressed &bull; <code>\"mouseover\"</code>, the mouse moves over<br><br>The function also receives an <b>event object</b> (call it <code>e</code> or <code>event</code>) with details about what happened. The most useful is <code>e.target</code>, the element the event happened on, and for an input, <code>e.target.value</code> is what's currently typed.", "code": "<input id=\"box\" placeholder=\"type something...\">\n<p id=\"out\">You typed: </p>\n\n<script>\n  const box = document.querySelector(\"#box\");\n  const out = document.querySelector(\"#out\");\n\n  // fires on every keystroke\n  box.addEventListener(\"input\", (e) => {\n    out.textContent = \"You typed: \" + e.target.value;\n  });\n<\/script>", "practice": ["Type in the box and watch the text update live on every key.", "Log <code>e.target</code> inside the handler to see the element in the console.", "Change the event from <code>\"input\"</code> to <code>\"click\"</code> on the box, notice it now only updates when you click it."], "gotcha": "<code>e.target</code> is <b>what the event happened on</b>. For inputs, <code>e.target.value</code> (or the input's <code>.value</code>) is the current text, remember this, it's how you read anything the user types."}, {"kind": "lesson", "title": "6 · Reading user input", "level": "Beginner", "type": "html", "explain": "Putting it together: grab what the user typed with <code>.value</code>, usually when they click a button. This is the exact first step of the Task Manager, read the box, then do something with it.", "code": "<input id=\"nameInput\" placeholder=\"Your name\">\n<button id=\"go\">Greet me</button>\n<p id=\"out\"></p>\n\n<script>\n  const input = document.querySelector(\"#nameInput\");\n  const out = document.querySelector(\"#out\");\n\n  document.querySelector(\"#go\").addEventListener(\"click\", () => {\n    const typed = input.value;              // read the box\n    out.textContent = \"Hello, \" + typed + \"!\";\n  });\n<\/script>", "practice": ["Type your name and click, see the greeting appear.", "Clear the box after greeting by adding <code>input.value = \"\";</code>.", "Ignore empty input: at the top of the click, add <code>if (input.value === \"\") return;</code>."], "gotcha": "<code>.value</code> is always a <b>string</b>. If you need a number (e.g. an age), convert it: <code>Number(input.value)</code>."}]}, {"day": "PART 3 · BUILDING & REMOVING CONTENT", "items": [{"kind": "lesson", "title": "7 · Creating & adding elements", "level": "Beginner", "type": "html", "explain": "So far we changed elements that already existed. Now we <b>make new ones</b> from JavaScript, in three steps:<br>1. <code>document.createElement(\"li\")</code>, build it<br>2. give it content: <code>li.textContent = \"...\"</code><br>3. attach it: <code>parent.appendChild(li)</code> (or <code>.prepend()</code> to add at the top)<br><br>This is how a to-do list grows when you add an item.", "code": "<button id=\"add\">Add item</button>\n<ul id=\"list\"></ul>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  let n = 0;\n\n  document.querySelector(\"#add\").addEventListener(\"click\", () => {\n    n++;\n    const li = document.createElement(\"li\");   // 1. build\n    li.textContent = \"Item \" + n;               // 2. fill\n    list.appendChild(li);                       // 3. attach\n  });\n<\/script>", "practice": ["Click the button a few times, watch the list grow.", "Change the text of each new item to include your name.", "Swap <code>appendChild</code> for <code>list.prepend(li)</code>, new items now appear at the top."], "gotcha": "<code>createElement</code> builds the element in memory, it only appears once you <code>appendChild</code> it to something already on the page."}, {"kind": "lesson", "title": "8 · Removing elements & delegation", "level": "Intermediate", "type": "html", "explain": "Remove an element with <code>element.remove()</code>. But there's a classic trap: a click listener you add to a button only works if that button <b>already existed</b>, items you create later get missed.<br><br>The fix is <b>event delegation</b>: instead of one listener per button, put <b>a single listener on the parent</b> that's always there, then check <b>what was actually clicked</b> using <code>e.target</code>. <code>e.target.closest(\"li\")</code> walks up to the whole row.", "code": "<ul id=\"list\">\n  <li>Task 1 <button class=\"del\">x</button></li>\n  <li>Task 2 <button class=\"del\">x</button></li>\n</ul>\n\n<script>\n  const list = document.querySelector(\"#list\");\n\n  // ONE listener on the parent handles every delete button\n  list.addEventListener(\"click\", (e) => {\n    if (e.target.classList.contains(\"del\")) {\n      e.target.closest(\"li\").remove();   // remove the row\n    }\n  });\n<\/script>", "practice": ["Click a delete button, its whole row disappears.", "Add a third <code>&lt;li&gt;</code> in the HTML, delegation handles it with no extra code.", "Change <code>e.target.closest(\"li\").remove()</code> to just <code>e.target.remove()</code> and see the difference (only the button goes)."], "gotcha": "Delegation = listen on the <b>stable parent</b>, check <code>e.target</code> for what was clicked. It's the key to lists where items get added and removed."}, {"kind": "lesson", "title": "9 · Forms & preventDefault", "level": "Intermediate", "type": "html", "explain": "A form <b>reloads the whole page</b> when submitted, which wipes your JS. In a JS app you almost always stop that: listen for <code>\"submit\"</code>, then call <code>e.preventDefault()</code> first thing. After that, read the input and do your thing. Using a form (instead of a plain button) means <b>Enter</b> also submits, nicer for users.", "code": "<form id=\"form\">\n  <input id=\"task\" placeholder=\"New task\">\n  <button>Add</button>\n</form>\n<ul id=\"list\"></ul>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const task = document.querySelector(\"#task\");\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();               // stop the page reload\n    if (task.value === \"\") return;\n    const li = document.createElement(\"li\");\n    li.textContent = task.value;\n    document.querySelector(\"#list\").appendChild(li);\n    task.value = \"\";                  // clear the box\n  });\n<\/script>", "practice": ["Type a task and press <b>Enter</b>, it adds without reloading.", "Remove <code>e.preventDefault()</code> and watch the page reload and wipe the list, then put it back.", "Block empty tasks with the <code>if</code> check."], "gotcha": "Always call <code>e.preventDefault()</code> first in a submit handler. Forget it and the page reloads, resetting everything your JS did."}]}, {"day": "PART 4 · REMEMBERING & FETCHING", "items": [{"kind": "lesson", "title": "10 · Saving with localStorage & JSON", "level": "Intermediate", "type": "html", "explain": "Everything disappears on refresh, unless you save it. <code>localStorage</code> keeps data in the browser between visits. It only stores <b>text</b>, so for arrays/objects you convert with JSON:<br>&bull; <code>localStorage.setItem(\"key\", text)</code>, save<br>&bull; <code>localStorage.getItem(\"key\")</code>, read (<code>null</code> if nothing saved)<br>&bull; <code>localStorage.removeItem(\"key\")</code>, delete<br>&bull; <code>JSON.stringify(data)</code>, turn an array/object into text (to save)<br>&bull; <code>JSON.parse(text)</code>, turn it back (to read)<br><b>The pattern:</b> load saved data when the page opens, save again after every change.", "code": "<input id=\"note\" placeholder=\"a note\">\n<button id=\"save\">Save</button>\n<button id=\"clear\">Clear</button>\n<p id=\"out\"></p>\n\n<script>\n  const out = document.querySelector(\"#out\");\n  // load on start (|| = fallback if nothing saved)\n  out.textContent = localStorage.getItem(\"note\") || \"(nothing saved)\";\n\n  document.querySelector(\"#save\").addEventListener(\"click\", () => {\n    const val = document.querySelector(\"#note\").value;\n    localStorage.setItem(\"note\", val);\n    out.textContent = val;\n  });\n  document.querySelector(\"#clear\").addEventListener(\"click\", () => {\n    localStorage.removeItem(\"note\");\n    out.textContent = \"(nothing saved)\";\n  });\n<\/script>", "practice": ["Save a note, then <b>refresh the preview</b>, it's still there. (Magic!)", "Use the Clear button to delete it, then refresh again.", "Change the Save button so it also clears the input box after saving."], "gotcha": "localStorage stores <b>strings only</b>. For arrays/objects: <code>JSON.stringify</code> to save, <code>JSON.parse</code> to load. Skip that and you save the useless text <code>\"[object Object]\"</code>."}, {"kind": "lesson", "title": "11 · Saving a list (stringify & parse)", "level": "Intermediate", "type": "html", "explain": "The note above was just text, so it saved directly. But your Task Manager saves a whole <b>list</b>, and localStorage <b>can't store arrays</b>, only strings. Two functions bridge that:<br><br>&bull; <code>JSON.stringify(array)</code> → turns your array into <b>text</b> you can save<br>&bull; <code>JSON.parse(text)</code> → turns that text <b>back into a real array</b><br><br>Think of a <b>suitcase</b>: <code>stringify</code> packs your things flat to fit through the slot; <code>parse</code> unpacks them on the other side. <b>Stringify to save, parse to load.</b><br><br>The example keeps it simple: one array, a <b>Save</b> button (watch it become text) and a <b>Load</b> button (watch it become a usable array again).", "code": "<button id=\"save\">Save the list</button>\n<button id=\"load\">Load the list</button>\n<p id=\"out\">Click Save, then Load.</p>\n\n<script>\n  const fruits = [\"apple\", \"banana\", \"mango\"];\n  const out = document.querySelector(\"#out\");\n\n  document.querySelector(\"#save\").addEventListener(\"click\", () => {\n    const text = JSON.stringify(fruits);        // array  ->  text\n    localStorage.setItem(\"fruits\", text);\n    out.textContent = \"Saved as text: \" + text; // see the quotes & brackets!\n  });\n\n  document.querySelector(\"#load\").addEventListener(\"click\", () => {\n    const text = localStorage.getItem(\"fruits\"); // read the text back\n    const list = JSON.parse(text);               // text  ->  array\n    out.textContent = \"Loaded! First fruit is: \" + list[0]; // [0] proves it is an array\n  });\n<\/script>", "practice": ["Click <b>Save</b>, notice the output shows text with quotes and brackets: <code>[\"apple\",\"banana\",\"mango\"]</code>.", "Click <b>Load</b>, it shows <code>apple</code>, proving <code>parse</code> gave back a real array you can index.", "Add a 4th fruit to the array, then Save and Load again to see it included."], "gotcha": "<b>Stringify to save, parse to load</b>, always a pair. Save an array <b>without</b> <code>stringify</code> and you store the useless text <code>\"[object Object]\"</code>; read it <b>without</b> <code>parse</code> and you get a string, so <code>list[0]</code> would give one letter, not <code>\"apple\"</code>."}, {"kind": "lesson", "title": "12 · Fetching live data", "level": "Advanced", "type": "html", "explain": "A peek at pulling <b>live data from the internet</b>, this powers the take-home GitHub Finder. <code>fetch(url)</code> requests data; because it takes time, we use <code>async/await</code>: mark the function <code>async</code>, <code>await</code> the fetch, then <code>await res.json()</code> for the data. Wrap it in <code>try/catch</code> since networks can fail. You'll explore this more on your own.", "code": "<button id=\"load\">Load a GitHub user</button>\n<div id=\"out\"></div>\n\n<script>\n  document.querySelector(\"#load\").addEventListener(\"click\", async () => {\n    const out = document.querySelector(\"#out\");\n    out.textContent = \"Loading...\";\n    try {\n      const res = await fetch(\"https://api.github.com/users/torvalds\");\n      const data = await res.json();\n      out.innerHTML = `<b>${data.name}</b> — ${data.public_repos} repos`;\n    } catch (err) {\n      out.textContent = \"Failed to load.\";\n    }\n  });\n<\/script>", "practice": ["Change the username in the URL to your own GitHub handle.", "Log the full <code>data</code> object to see everything the API sends back.", "Also show <code>data.followers</code> next to the repo count."], "gotcha": "<code>fetch</code> returns a <b>promise</b> (a “later” value), so you must <code>await</code> it, and <code>await res.json()</code> separately. Always wrap real network code in <code>try/catch</code>.", "optional": true}]}, {"day": "DAY 5 · BONUS", "items": [{"kind": "lesson", "title": "⭐ Bonus · Task Manager", "level": "Bonus", "type": "html", "explain": "⭐ Every idea from today in one small app, and basically <b>Project 2</b>. Add tasks, click a task to mark it done, delete with ×, and it all <b>saves to localStorage</b> (refresh, it stays). See how it fits together: the data is an <b>array of objects</b> (from Day 4!), <code>render()</code> redraws the list from that data, and every change calls <code>save()</code>. On Day 7 you'll polish this and add features.", "code": "<style>\n  body { font-family: sans-serif; max-width: 380px; }\n  .row { display: flex; gap: 8px; margin-bottom: 12px; }\n  #input { flex: 1; padding: 8px; }\n  button { padding: 8px 12px; cursor: pointer; }\n  li { display: flex; justify-content: space-between; align-items: center;\n       padding: 8px; border-bottom: 1px solid #eee; list-style: none; }\n  li.done span { text-decoration: line-through; color: #999; }\n  .del { background: #ef4444; color: #fff; border: none; border-radius: 4px; }\n  span { cursor: pointer; flex: 1; }\n</style>\n\n<h3>Task Manager</h3>\n<div class=\"row\">\n  <input id=\"input\" placeholder=\"Add a task...\">\n  <button id=\"add\">Add</button>\n</div>\n<ul id=\"list\"></ul>\n\n<script>\n  const input = document.querySelector(\"#input\");\n  const list = document.querySelector(\"#list\");\n  let tasks = JSON.parse(localStorage.getItem(\"tasks\")) || [];\n\n  function save() {\n    localStorage.setItem(\"tasks\", JSON.stringify(tasks));\n  }\n\n  function render() {\n    list.innerHTML = \"\";\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `<span>${task.title}</span>\n                      <button class=\"del\">x</button>`;\n      list.appendChild(li);\n    });\n  }\n\n  document.querySelector(\"#add\").addEventListener(\"click\", () => {\n    if (input.value === \"\") return;\n    tasks.push({ title: input.value, done: false });\n    input.value = \"\";\n    save(); render();\n  });\n\n  list.addEventListener(\"click\", (e) => {\n    const li = e.target.closest(\"li\");\n    if (!li) return;\n    const i = Number(li.dataset.i);\n    if (e.target.classList.contains(\"del\")) {\n      tasks.splice(i, 1);              // delete\n    } else {\n      tasks[i].done = !tasks[i].done;  // toggle done\n    }\n    save(); render();\n  });\n\n  render();\n<\/script>", "practice": ["Add a few tasks, then refresh the preview, they persist.", "Click a task's text to mark it done; click again to undo.", "Change the delete button's colour, or add a “Clear all” button that empties <code>tasks</code> and re-renders."], "gotcha": "This <b>is</b> Project 2. Notice every piece is something you learned today: select, events, create, delete, delegation, localStorage. Day 7 is just polish and extras."}]}];
const flat=[];SEC.forEach(s=>s.items.forEach(it=>flat.push({...it,day:s.day})));
const nav=document.getElementById("nav"),editor=document.getElementById("editor"),output=document.getElementById("output"),
  lessonTitle=document.getElementById("lessonTitle"),lessonBadge=document.getElementById("lessonBadge"),lessonExplain=document.getElementById("lessonExplain"),
  progress=document.getElementById("progress"),workspace=document.getElementById("workspace"),runBtn=document.getElementById("runBtn"),
  resetBtn=document.getElementById("resetBtn"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),runHint=document.getElementById("runHint"),
  codeLabel=document.getElementById("codeLabel");
let current=0,debounce=null;
SEC.forEach(s=>{const label=document.createElement("div");label.className="group-label";label.textContent=s.day;nav.appendChild(label);
  s.items.forEach(it=>{const idx=flat.findIndex(f=>f.title===it.title&&f.day===s.day&&f.explain===it.explain);
    const btn=document.createElement("button");btn.className="nav-item"+(it.kind==="info"?" info":"");btn.dataset.idx=idx;
    btn.innerHTML='<i class="dot d-'+it.level+'"></i>'+it.title+(it.optional?' <span class="opt-tag">opt</span>':'');btn.addEventListener("click",()=>load(idx));nav.appendChild(btn);});});

const CAP='<scr'+'ipt>(function(){var b=[],el=null;function f(v){if(v===null)return "null";if(v===undefined)return "undefined";if(typeof v==="function")return "[function]";if(typeof v==="object"){try{return JSON.stringify(v);}catch(e){return String(v);}}return String(v);}function o(c,a){var s=[].map.call(a,f).join(" ");if(el){var d=document.createElement("div");if(c)d.className=c;d.textContent=s;el.appendChild(d);}else b.push([c,s]);}console.log=function(){o("",arguments);};console.info=console.log;console.error=function(){o("e",arguments);};console.warn=function(){o("w",arguments);};window.addEventListener("error",function(e){o("e",[e.message]);});document.addEventListener("DOMContentLoaded",function(){el=document.getElementById("__con");b.forEach(function(x){var d=document.createElement("div");if(x[0])d.className=x[0];d.textContent=x[1];el.appendChild(d);});b=[];});})();<\/scr'+'ipt>';
const FSTYLE='<style>body{font-family:-apple-system,sans-serif;margin:0;color:#1b1b28}#app{padding:14px}#app:empty{display:none}#__wrap{border-top:1px solid #2a2a3a}#__lbl{background:#12121a;color:#8a8a98;font:600 10px monospace;letter-spacing:.12em;padding:5px 12px}#__con{background:#1e1e2e;color:#e6e6f0;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;padding:8px 12px;white-space:pre-wrap;min-height:34px;line-height:1.55}#__con div{padding:1px 0}#__con .e{color:#ff6b6b}#__con .w{color:#fbbf24}</style>';
function frameDoc(bodyHtml,jsCode){
  var app='<div id="app">'+(bodyHtml||'')+'</div>';
  var box='<div id="__wrap"><div id="__lbl">&#9656; CONSOLE</div><div id="__con"></div></div>';
  var js=jsCode?('<scr'+'ipt>try{\n'+jsCode+'\n}catch(e){console.error(e.message);}<\/scr'+'ipt>'):'';
  return FSTYLE+CAP+app+box+js;
}
function setFrame(doc){output.innerHTML="";var f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-same-origin");output.appendChild(f);f.srcdoc=doc;}
function runJS(code){setFrame(frameDoc("",code));}
function runHTML(code){if(/<!doctype|<html[\s>]/i.test(code)){setFrame(code);}else{setFrame(frameDoc(code,""));}}
function runCurrent(){const it=flat[current];if(it.type==="js")runJS(editor.value);else if(it.type==="html")runHTML(editor.value);}
function load(idx){current=idx;const it=flat[idx];lessonTitle.textContent=it.title;lessonBadge.textContent=it.level;lessonBadge.className="badge-level b-"+it.level;
  let ex=it.explain;
  if(it.optional)ex='<div class="opt-banner"><b>Optional \u00b7 self-study.</b> Not needed for the projects yet. Skip if short on time, or explore on your own.</div>'+ex;
  if(it.practice&&it.practice.length){var where=it.type==="js"?"Type it in your console (F12 \u2192 Console), run each, then make these changes:":"Build it in your <code>index.html</code> + <code>script.js</code> (or edit below), then try these:";ex+='<div class="practice"><div class="pt">\u25b6 Your turn</div><div class="pw">'+where+'</div><ol><li>'+it.practice.join("</li><li>")+'</li></ol></div>';}
  if(it.gotcha)ex+='<div class="gotcha"><b>Gotcha:</b> '+it.gotcha+"</div>";
  lessonExplain.innerHTML=ex;
  progress.textContent=(idx+1)+" / "+flat.length+"  \u00B7  "+it.day;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",Number(b.dataset.idx)===idx));
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===flat.length-1;
  if(it.kind==="info"){workspace.style.display="none";}else{workspace.style.display="grid";editor.value=it.code;codeLabel.textContent=(it.type==="js"?"JavaScript":"HTML + script")+" \u00b7 edit me";runHint.textContent="Ctrl/Cmd+Enter to run";runCurrent();}
  document.querySelector(".content").scrollTop=0;}
editor.addEventListener("input",()=>{if(flat[current].kind==="info")return;clearTimeout(debounce);debounce=setTimeout(runCurrent,400);});
editor.addEventListener("keydown",(e)=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCurrent();}if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);editor.selectionStart=editor.selectionEnd=s+2;}});
runBtn.addEventListener("click",runCurrent);resetBtn.addEventListener("click",()=>{editor.value=flat[current].code;runCurrent();});
prevBtn.addEventListener("click",()=>{if(current>0)load(current-1);});nextBtn.addEventListener("click",()=>{if(current<flat.length-1)load(current+1);});
load(0);
</script></body></html>
