<script>
const SEC = [{"day": "START", "items": [{"kind": "info", "title": "Today: forms, saving, and the Task Manager", "level": "Start", "type": "info", "explain": "<h3>Where we are, and where we're going.</h3><p>Nice work yesterday. You can already <b>select</b> elements, <b>change</b> them, <b>respond to clicks</b>, <b>create</b> and <b>remove</b> elements, and use <b>event delegation</b>, plus you went back over <b>objects, arrays of objects, and for...in</b>. That's the whole backbone of today.</p><p><b>Three short lessons, then we build, in small steps:</b> Forms &amp; preventDefault → Saving with localStorage &amp; JSON → a full, good-looking Task Manager built one idea at a time.</p><p>Same careful pace as yesterday: one new idea per step, type it yourself, do the “Your turn” challenges, and predict what each change will do <i>before</i> you run it. Take-home assignments (with hints) are on a separate sheet.</p>"}]}, {"day": "NEW · TAKING INPUT WITH FORMS", "items": [{"kind": "lesson", "title": "1 · Forms & preventDefault", "level": "Intermediate", "type": "html", "explain": "A form <b>reloads the whole page</b> when submitted, which wipes your JS. In a JS app you almost always stop that: listen for <code>\"submit\"</code>, then call <code>e.preventDefault()</code> first thing. After that, read the input and do your thing. Using a form (instead of a plain button) means <b>Enter</b> also submits, nicer for users.", "code": "<form id=\"form\">\n  <input id=\"task\" placeholder=\"New task\">\n  <button>Add</button>\n</form>\n<ul id=\"list\"></ul>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const task = document.querySelector(\"#task\");\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();               // stop the page reload\n    if (task.value === \"\") return;\n    const li = document.createElement(\"li\");\n    li.textContent = task.value;\n    document.querySelector(\"#list\").appendChild(li);\n    task.value = \"\";                  // clear the box\n  });\n<\/script>", "practice": ["Type a task and press <b>Enter</b>, it adds without reloading.", "Remove <code>e.preventDefault()</code> and watch the page reload and wipe the list, then put it back.", "Block empty tasks with the <code>if</code> check."], "gotcha": "Always call <code>e.preventDefault()</code> first in a submit handler. Forget it and the page reloads, resetting everything your JS did."}]}, {"day": "NEW · SAVING DATA", "items": [{"kind": "lesson", "title": "2 · Saving with localStorage", "level": "Intermediate", "type": "html", "explain": "Everything disappears on refresh, unless you save it. <code>localStorage</code> keeps data in the browser between visits. It only stores <b>text</b>, so for arrays/objects you convert with JSON:<br>&bull; <code>localStorage.setItem(\"key\", text)</code>, save<br>&bull; <code>localStorage.getItem(\"key\")</code>, read (<code>null</code> if nothing saved)<br>&bull; <code>localStorage.removeItem(\"key\")</code>, delete<br>&bull; <code>JSON.stringify(data)</code>, turn an array/object into text (to save)<br>&bull; <code>JSON.parse(text)</code>, turn it back (to read)<br><b>The pattern:</b> load saved data when the page opens, save again after every change.", "code": "<input id=\"note\" placeholder=\"a note\">\n<button id=\"save\">Save</button>\n<button id=\"clear\">Clear</button>\n<p id=\"out\"></p>\n\n<script>\n  const out = document.querySelector(\"#out\");\n  // load on start (|| = fallback if nothing saved)\n  out.textContent = localStorage.getItem(\"note\") || \"(nothing saved)\";\n\n  document.querySelector(\"#save\").addEventListener(\"click\", () => {\n    const val = document.querySelector(\"#note\").value;\n    localStorage.setItem(\"note\", val);\n    out.textContent = val;\n  });\n  document.querySelector(\"#clear\").addEventListener(\"click\", () => {\n    localStorage.removeItem(\"note\");\n    out.textContent = \"(nothing saved)\";\n  });\n<\/script>", "practice": ["Save a note, then <b>refresh the preview</b>, it's still there. (Magic!)", "Use the Clear button to delete it, then refresh again.", "Change the Save button so it also clears the input box after saving."], "gotcha": "localStorage stores <b>strings only</b>. For arrays/objects: <code>JSON.stringify</code> to save, <code>JSON.parse</code> to load. Skip that and you save the useless text <code>\"[object Object]\"</code>."}, {"kind": "lesson", "title": "3 · Saving a list (stringify & parse)", "level": "Intermediate", "type": "html", "explain": "The note above was just text, so it saved directly. But your Task Manager saves a whole <b>list</b>, and localStorage <b>can't store arrays</b>, only strings. Two functions bridge that:<br><br>&bull; <code>JSON.stringify(array)</code> → turns your array into <b>text</b> you can save<br>&bull; <code>JSON.parse(text)</code> → turns that text <b>back into a real array</b><br><br>Think of a <b>suitcase</b>: <code>stringify</code> packs your things flat to fit through the slot; <code>parse</code> unpacks them on the other side. <b>Stringify to save, parse to load.</b><br><br>The example keeps it simple: one array, a <b>Save</b> button (watch it become text) and a <b>Load</b> button (watch it become a usable array again).", "code": "<button id=\"save\">Save the list</button>\n<button id=\"load\">Load the list</button>\n<p id=\"out\">Click Save, then Load.</p>\n\n<script>\n  const fruits = [\"apple\", \"banana\", \"mango\"];\n  const out = document.querySelector(\"#out\");\n\n  document.querySelector(\"#save\").addEventListener(\"click\", () => {\n    const text = JSON.stringify(fruits);        // array  ->  text\n    localStorage.setItem(\"fruits\", text);\n    out.textContent = \"Saved as text: \" + text; // see the quotes & brackets!\n  });\n\n  document.querySelector(\"#load\").addEventListener(\"click\", () => {\n    const text = localStorage.getItem(\"fruits\"); // read the text back\n    const list = JSON.parse(text);               // text  ->  array\n    out.textContent = \"Loaded! First fruit is: \" + list[0]; // [0] proves it is an array\n  });\n<\/script>", "practice": ["Click <b>Save</b>, notice the output shows text with quotes and brackets: <code>[\"apple\",\"banana\",\"mango\"]</code>.", "Click <b>Load</b>, it shows <code>apple</code>, proving <code>parse</code> gave back a real array you can index.", "Add a 4th fruit to the array, then Save and Load again to see it included."], "gotcha": "<b>Stringify to save, parse to load</b>, always a pair. Save an array <b>without</b> <code>stringify</code> and you store the useless text <code>\"[object Object]\"</code>; read it <b>without</b> <code>parse</code> and you get a string, so <code>list[0]</code> would give one letter, not <code>\"apple\"</code>."}]}, {"day": "BUILD · SET UP", "items": [{"kind": "lesson", "title": "Step 1 · The starter (with design)", "level": "Beginner", "type": "html", "explain": "Your app shell, already styled so it looks good from the start: a card, a proper input inside a <code>&lt;form&gt;</code>, and a friendly empty state. Copy it in and open it; nothing works yet, that's the next few steps.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> the full starter (HTML + CSS)</p><pre><code>&lt;style&gt;\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, &quot;Segoe UI&quot;, sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n&lt;/style&gt;\n\n&lt;div class=&quot;app&quot;&gt;\n  &lt;h1&gt;📋 My Tasks&lt;/h1&gt;\n  &lt;p class=&quot;sub&quot;&gt;Stay on top of your day.&lt;/p&gt;\n  &lt;form class=&quot;row&quot; id=&quot;form&quot;&gt;\n    &lt;input id=&quot;input&quot; placeholder=&quot;What needs doing?&quot;&gt;\n    &lt;button&gt;Add&lt;/button&gt;\n  &lt;/form&gt;\n  &lt;ul id=&quot;list&quot;&gt;&lt;/ul&gt;\n  &lt;p class=&quot;count&quot; id=&quot;count&quot;&gt;&lt;/p&gt;\n&lt;/div&gt;</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  // Your JavaScript goes here — nothing works yet.\n<\/script>", "practice": ["Change the title, subtitle, and emoji to make it yours.", "Change the accent colour <code>#6d5cf6</code> wherever it appears.", "Change the empty-state message."], "gotcha": "The input is inside a <code>&lt;form&gt;</code> on purpose, we'll use yesterday's forms lesson to add tasks in step 6."}]}, {"day": "BUILD · SHOW THE LIST", "items": [{"kind": "lesson", "title": "Step 2 · forEach with an index", "level": "Beginner", "type": "html", "explain": "First, a small but important new trick. So far you used <code>forEach</code> with <b>one</b> value, the item. But <code>forEach</code> can hand you a <b>second</b> value too: the item's <b>position</b>, called the <b>index</b>, counting from 0. Just add a second name in the brackets.<br><br>The easiest way to see it: compare with the <b>for loop from Day 4</b>. They do <b>exactly the same job</b>, the difference is who does the counting:<br><br>&bull; In a <code>for</code> loop, <b>you</b> make the counter (<code>let i = 0</code>), <b>you</b> stop it (<code>i &lt; tasks.length</code>), <b>you</b> step it (<code>i++</code>), and <b>you</b> fetch the item with <code>tasks[i]</code>.<br>&bull; With <code>forEach</code>, the array does all of that for you and simply <b>hands you both</b>: the item (<code>task</code>) and its position (<code>i</code>), one pair per turn.<br><br>Same loop, same output, less to write and nothing to get wrong (no <code>i++</code> to forget). That's why we'll use <code>forEach</code>. Run the example and check the console (F12), the two loops print identical pairs.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> both loops, same job, compare them</p><pre><code>let tasks = [\n  { title: &quot;Repeat arrays of objects&quot;, done: true },\n  { title: &quot;Build the task manager&quot;, done: false },\n];\n\n// the for loop from Day 4 — YOU manage the counter, YOU fetch tasks[i]:\nfor (let i = 0; i &lt; tasks.length; i++) {\n  console.log(&quot;for    &quot;, i, tasks[i].title);\n}\n\n// forEach — the array hands you the item AND the index:\ntasks.forEach((task, i) =&gt; {\n  console.log(&quot;forEach&quot;, i, task.title);\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [\n    { title: \"Repeat arrays of objects\", done: true },\n    { title: \"Build the task manager\", done: false },\n  ];\n\n  // the for loop from Day 4 — YOU write the counter, and use tasks[i]:\n  for (let i = 0; i < tasks.length; i++) {\n    console.log(\"for    \", i, tasks[i].title);\n  }\n\n  // forEach — the item (task) AND the index (i) are handed to you:\n  tasks.forEach((task, i) => {\n    console.log(\"forEach\", i, task.title);\n  });\n<\/script>", "practice": ["Run it, both loops print the same pairs: <code>0 Repeat...</code>, <code>1 Build...</code>.", "Add a third task, <b>predict</b> what both loops print, then run. Neither loop needed changing!", "In the forEach, log <code>i + 1</code> so it reads 1, 2 like a human list.", "Delete the whole for loop and keep only forEach, this is the one we build with from here."], "gotcha": "In <code>for</code>, you fetch the item yourself with <code>tasks[i]</code>; in <code>forEach</code>, <code>task</code> <i>is</i> the item already, no brackets needed. The index still starts at <b>0</b> in both."}, {"kind": "lesson", "title": "Step 3 · Draw each task on the page", "level": "Beginner", "type": "html", "explain": "Now put the tasks on screen instead of in the console. For <b>each</b> task, create an <code>&lt;li&gt;</code>, set its text to the title, and append it to the list. This is <code>createElement</code> + <code>appendChild</code> from yesterday, now running inside the loop.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> replace the console.log loop with this</p><pre><code>tasks.forEach((task, i) =&gt; {\n  const li = document.createElement(&quot;li&quot;);\n  li.textContent = task.title;\n  list.appendChild(li);\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [\n    { title: \"Repeat arrays of objects\", done: true },\n    { title: \"Build the task manager\", done: false },\n  ];\n\n  tasks.forEach((task, i) => {\n    const li = document.createElement(\"li\");\n    li.textContent = task.title;\n    list.appendChild(li);\n  });\n<\/script>", "practice": ["You should now see the two task titles as list items.", "Show <code>(i + 1) + \". \" + task.title</code> to number them.", "Add another task to the array and watch it appear."], "gotcha": "<code>createElement</code> builds the <code>&lt;li&gt;</code> in memory; it only shows up once you <code>appendChild</code> it to the list."}, {"kind": "lesson", "title": "Step 4 · Wrap it in a render() function", "level": "Beginner", "type": "html", "explain": "Right now the list is drawn <b>once</b>. But we'll be adding and deleting tasks, so we need to <b>redraw whenever the data changes</b>. Put the drawing inside a function called <code>render()</code>, and call it. Two important bits: it <b>clears the list first</b> (<code>list.innerHTML = \"\"</code>) so we don't pile up duplicates, and it shows a friendly message when there are no tasks.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> wrap your loop in render(), then call it</p><pre><code>function render() {\n  list.innerHTML = &quot;&quot;;                 // clear first — no duplicates!\n  if (tasks.length === 0) {\n    list.innerHTML = &quot;&lt;p class=&#x27;empty&#x27;&gt;Nothing here yet. Add your first task! 🎉&lt;/p&gt;&quot;;\n  }\n  tasks.forEach((task, i) =&gt; {\n    const li = document.createElement(&quot;li&quot;);\n    li.textContent = task.title;\n    list.appendChild(li);\n  });\n}\n\nrender();   // draw it</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [\n    { title: \"Repeat arrays of objects\", done: true },\n    { title: \"Build the task manager\", done: false },\n  ];\n\n  function render() {\n    list.innerHTML = \"\";                 // clear it first (no duplicates)\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.textContent = task.title;\n      list.appendChild(li);\n    });\n  }\n\n  render();\n<\/script>", "practice": ["Everything looks the same, but now the drawing is reusable.", "Comment out <code>list.innerHTML = \"\"</code>, then call <code>render()</code> twice, see the duplicates? That's why we clear.", "Empty the <code>tasks</code> array to see the empty-state message."], "gotcha": "<code>render()</code> = “redraw the whole list from the array.” Clearing first (<code>innerHTML = \"\"</code>) is what stops duplicates each time you redraw."}, {"kind": "lesson", "title": "Step 5 · A real task row (checkbox, delete, done)", "level": "Beginner", "type": "html", "explain": "Make each row look like a real task: a <b>check box</b>, the <b>title</b>, and a <b>delete button</b>, built with a <b>template literal</b> inside <code>innerHTML</code>. If the task is done, we add the <code>done</code> class (the CSS strikes it through and fills the box).<br><br><b>And one new tool: <code>dataset</code>.</b> HTML lets you attach your own custom info to any element with attributes starting with <code>data-</code>, like <code>&lt;li data-i=\"3\"&gt;</code>. The browser ignores them completely; they're just <b>sticky notes</b> you leave on an element. In JavaScript, <code>element.dataset</code> is how you write and read those notes: writing <code>li.dataset.i = i</code> creates <code>data-i=\"...\"</code> on that <code>&lt;li&gt;</code> (the <code>data-</code> prefix drops off in JS).<br><br><b>Why we need it:</b> when someone clicks a row later, the click only tells us <i>which element</i> was hit, not <i>which task in the array</i> it belongs to. So while drawing, we write each task's index onto its own row as a sticky note. Each row now carries its own address in the array, and we'll read it back in step 8.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> upgrade the inside of your forEach</p><pre><code>tasks.forEach((task, i) =&gt; {\n  const li = document.createElement(&quot;li&quot;);\n  li.dataset.i = i;                      // remember which task this row is\n  if (task.done) li.classList.add(&quot;done&quot;);\n  li.innerHTML = `\n    &lt;span class=&quot;check&quot;&gt;${task.done ? &quot;✓&quot; : &quot;&quot;}&lt;/span&gt;\n    &lt;span class=&quot;title&quot;&gt;${task.title}&lt;/span&gt;\n    &lt;button class=&quot;del&quot;&gt;✕&lt;/button&gt;`;\n  list.appendChild(li);\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [\n    { title: \"Repeat arrays of objects\", done: true },\n    { title: \"Build the task manager\", done: false },\n  ];\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;                      // remember which task this row is\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n  }\n\n  render();\n<\/script>", "practice": ["The rows now have a tick box and an ✕. The done sample task is ticked and struck through.", "Right-click a row → Inspect: see the <code>data-i=\"0\"</code> attribute sitting on the <code>&lt;li&gt;</code>, your sticky note, in the real HTML.", "Change the ✕ to the word “Delete”.", "Flip a task's <code>done</code> in the array between true/false and rerun."], "gotcha": "The naming rule: <code>data-i</code> in HTML ↔ <code>dataset.i</code> in JS, the <code>data-</code> prefix drops off. You can invent any note you like: <code>li.dataset.priority = \"high\"</code> becomes <code>data-priority=\"high\"</code>."}, {"kind": "lesson", "title": "Step 6 · Show the count", "level": "Beginner", "type": "html", "explain": "Add the little “X of Y left” line. <code>filter</code> (from Day 4) builds a new array of only the tasks that pass a test, here, the <b>not-done</b> ones, and <code>.length</code> counts them. Put this at the end of <code>render()</code>, after the loop.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> add at the bottom of render(), after the forEach</p><pre><code>const left = tasks.filter((t) =&gt; !t.done).length;\ncountEl.textContent = tasks.length ? left + &quot; of &quot; + tasks.length + &quot; left&quot; : &quot;&quot;;</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [\n    { title: \"Repeat arrays of objects\", done: true },\n    { title: \"Build the task manager\", done: false },\n  ];\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n    const left = tasks.filter((t) => !t.done).length;\n    countEl.textContent = tasks.length ? left + \" of \" + tasks.length + \" left\" : \"\";\n  }\n\n  render();\n<\/script>", "practice": ["The count shows “1 of 2 left” for the samples.", "Change the wording to “X done of Y” instead.", "Mark both samples done in the array, watch the count."], "gotcha": "<code>filter((t) =&gt; !t.done)</code> keeps the unfinished tasks; <code>.length</code> counts them. filter returns a <b>new</b> array and never changes the original."}]}, {"day": "BUILD · MAKE IT WORK", "items": [{"kind": "lesson", "title": "Step 7 · Add tasks with the form", "level": "Beginner", "type": "html", "explain": "Now the forms lesson pays off. Listen for the form's <b>submit</b>, call <code>e.preventDefault()</code> so the page doesn't reload, read the input, push a new task object, clear the box, and <code>render()</code>. Because it's a form, <b>Enter adds too</b>, for free. (Change your starting array to empty <code>[]</code> now.)<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> empty the array + add the form handler</p><pre><code>let tasks = [];   // start empty\n\nform.addEventListener(&quot;submit&quot;, (e) =&gt; {\n  e.preventDefault();                 // stop the reload\n  const text = input.value.trim();\n  if (text === &quot;&quot;) return;\n  tasks.push({ title: text, done: false });\n  input.value = &quot;&quot;;\n  render();\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const input = document.querySelector(\"#input\");\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [];\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n    const left = tasks.filter((t) => !t.done).length;\n    countEl.textContent = tasks.length ? left + \" of \" + tasks.length + \" left\" : \"\";\n  }\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const text = input.value.trim();\n    if (text === \"\") return;\n    tasks.push({ title: text, done: false });\n    input.value = \"\";\n    render();\n  });\n\n  render();\n<\/script>", "practice": ["Add tasks by clicking Add <b>and</b> by pressing Enter.", "Try an empty task, the <code>if</code> blocks it.", "Delete <code>e.preventDefault()</code> and watch the page reload and wipe everything (then restore it)."], "gotcha": "You'll also need to grab the form and input at the top: <code>const form = ...; const input = ...;</code>. <code>preventDefault()</code> is the whole trick with forms."}, {"kind": "lesson", "title": "Step 8 · Mark tasks done", "level": "Beginner", "type": "html", "explain": "Click a row's check box or title to toggle it done. One listener on the <code>&lt;ul&gt;</code> (delegation, from yesterday). And here's where the <b>sticky note pays off</b>: in step 5 we wrote each task's index onto its row with <code>li.dataset.i = i</code>; now the click handler <b>reads the note back</b> with <code>li.dataset.i</code> to learn which task this row is. One catch: attributes are always stored as <b>text</b>, so it comes back as a string like <code>\"1\"</code>, wrap it in <code>Number()</code> to use it as an array index. Then flip that task's <code>done</code>.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> add this listener</p><pre><code>list.addEventListener(&quot;click&quot;, (e) =&gt; {\n  const li = e.target.closest(&quot;li&quot;);\n  if (!li) return;\n  const i = Number(li.dataset.i);        // read the index back, as a number\n  if (e.target.classList.contains(&quot;title&quot;) || e.target.classList.contains(&quot;check&quot;)) {\n    tasks[i].done = !tasks[i].done;      // flip done &lt;-&gt; not done\n    render();\n  }\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const input = document.querySelector(\"#input\");\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [];\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n    const left = tasks.filter((t) => !t.done).length;\n    countEl.textContent = tasks.length ? left + \" of \" + tasks.length + \" left\" : \"\";\n  }\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const text = input.value.trim();\n    if (text === \"\") return;\n    tasks.push({ title: text, done: false });\n    input.value = \"\";\n    render();\n  });\n\n  list.addEventListener(\"click\", (e) => {\n    const li = e.target.closest(\"li\");\n    if (!li) return;\n    const i = Number(li.dataset.i);        // read the index back (as a number)\n    if (e.target.classList.contains(\"title\") || e.target.classList.contains(\"check\")) {\n      tasks[i].done = !tasks[i].done;\n      render();\n    }\n  });\n\n  render();\n<\/script>", "practice": ["Click a check box and a title, both toggle done and update the count.", "Toggle one back and forth a few times.", "Change the done style in CSS (<code>li.done .title</code>)."], "gotcha": "<code>li.dataset.i</code> gives a <b>string</b> like <code>\"1\"</code>, <code>Number()</code> turns it into <code>1</code> so <code>tasks[i]</code> works. <code>!tasks[i].done</code> flips true↔false."}, {"kind": "lesson", "title": "Step 9 · Delete tasks (splice)", "level": "Beginner", "type": "html", "explain": "Add deleting to the <b>same</b> listener. To remove an item from an array we use <b>splice</b>: <code>array.splice(start, count)</code> removes <code>count</code> items starting at position <code>start</code>. So <code>tasks.splice(i, 1)</code> means <b>“remove 1 item at index i”</b>, exactly the clicked task. We just add a branch: if the delete button was clicked, splice; otherwise toggle.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> update your listener to also handle delete</p><pre><code>list.addEventListener(&quot;click&quot;, (e) =&gt; {\n  const li = e.target.closest(&quot;li&quot;);\n  if (!li) return;\n  const i = Number(li.dataset.i);\n  if (e.target.classList.contains(&quot;del&quot;)) {\n    tasks.splice(i, 1);                  // remove 1 task at index i\n  } else {\n    tasks[i].done = !tasks[i].done;\n  }\n  render();\n});</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const input = document.querySelector(\"#input\");\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  let tasks = [];\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n    const left = tasks.filter((t) => !t.done).length;\n    countEl.textContent = tasks.length ? left + \" of \" + tasks.length + \" left\" : \"\";\n  }\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const text = input.value.trim();\n    if (text === \"\") return;\n    tasks.push({ title: text, done: false });\n    input.value = \"\";\n    render();\n  });\n\n  list.addEventListener(\"click\", (e) => {\n    const li = e.target.closest(\"li\");\n    if (!li) return;\n    const i = Number(li.dataset.i);\n    if (e.target.classList.contains(\"del\")) {\n      tasks.splice(i, 1);                  // remove 1 task at index i\n    } else {\n      tasks[i].done = !tasks[i].done;\n    }\n    render();\n  });\n\n  render();\n<\/script>", "practice": ["Delete a few tasks with the ✕, the count and empty state keep up.", "Try <code>tasks.splice(i, 2)</code>, it removes two; then change it back to 1.", "<code>console.log(tasks)</code> before and after a delete to see the array shrink."], "gotcha": "<code>splice(i, 1)</code> = remove 1 item at index i, and it <b>changes the original array</b>. Don't confuse it with <code>slice</code> (which copies part of an array and changes nothing)."}, {"kind": "lesson", "title": "Step 10 · Remember everything (saving)", "level": "Intermediate", "type": "html", "explain": "The final piece, using the saving lesson. Add <code>save()</code> (stringify the array into localStorage), <b>load</b> it on start with <code>JSON.parse</code>, and call <code>save()</code> after <b>every</b> change. Now your tasks survive a refresh, and closing the browser. That's a complete, real app.<p style=\"margin:10px 0 4px\"><span class=\"add\">+ Add / change this:</span> load on start, add save(), call it after every change</p><pre><code>// at the top, LOAD instead of starting empty:\nlet tasks = JSON.parse(localStorage.getItem(&quot;tasks&quot;)) || [];\n\nfunction save() {\n  localStorage.setItem(&quot;tasks&quot;, JSON.stringify(tasks));\n}\n\n// then put  save();  before each render() in the form handler and the click listener\n//   e.g.   save(); render();</code></pre>", "code": "<style>\n  * { box-sizing: border-box; }\n  body { font-family: -apple-system, \"Segoe UI\", sans-serif; background: #f4f3f8; color: #1b1b28; max-width: 480px; margin: 22px auto; padding: 0 14px; }\n  .app { background: #fff; border-radius: 14px; box-shadow: 0 4px 22px rgba(20,15,60,.07); padding: 22px; }\n  h1 { font-size: 1.4rem; margin-bottom: 2px; }\n  .sub { color: #6a6a7d; font-size: .88rem; margin-bottom: 18px; }\n  form.row { display: flex; gap: 8px; margin-bottom: 16px; }\n  #input { flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 9px; font-size: 1rem; }\n  #input:focus { outline: none; border-color: #6d5cf6; }\n  form button { padding: 11px 18px; border: none; background: #6d5cf6; color: #fff; border-radius: 9px; cursor: pointer; font-size: 1rem; }\n  form button:hover { background: #5a49e0; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #faf9ff; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: transform .12s; }\n  li:hover { transform: translateX(3px); }\n  li.done .title { text-decoration: line-through; color: #b0b0bd; }\n  .check { width: 22px; height: 22px; border: 2px solid #6d5cf6; border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; }\n  li.done .check { background: #6d5cf6; }\n  .title { flex: 1; cursor: pointer; }\n  .del { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 1.1rem; opacity: .55; }\n  .del:hover { opacity: 1; }\n  .empty { text-align: center; color: #aaa; padding: 26px 0; }\n  .count { color: #6a6a7d; font-size: .85rem; text-align: right; margin-top: 12px; }\n</style>\n\n<div class=\"app\">\n  <h1>📋 My Tasks</h1>\n  <p class=\"sub\">Stay on top of your day.</p>\n  <form class=\"row\" id=\"form\">\n    <input id=\"input\" placeholder=\"What needs doing?\">\n    <button>Add</button>\n  </form>\n  <ul id=\"list\"></ul>\n  <p class=\"count\" id=\"count\"></p>\n</div>\n\n<script>\n  const form = document.querySelector(\"#form\");\n  const input = document.querySelector(\"#input\");\n  const list = document.querySelector(\"#list\");\n  const countEl = document.querySelector(\"#count\");\n\n  // LOAD saved tasks on start (or an empty list)\n  let tasks = JSON.parse(localStorage.getItem(\"tasks\")) || [];\n\n  function save() {\n    localStorage.setItem(\"tasks\", JSON.stringify(tasks));\n  }\n\n  function render() {\n    list.innerHTML = \"\";\n    if (tasks.length === 0) {\n      list.innerHTML = \"<p class='empty'>Nothing here yet. Add your first task! 🎉</p>\";\n    }\n    tasks.forEach((task, i) => {\n      const li = document.createElement(\"li\");\n      li.dataset.i = i;\n      if (task.done) li.classList.add(\"done\");\n      li.innerHTML = `\n        <span class=\"check\">${task.done ? \"✓\" : \"\"}</span>\n        <span class=\"title\">${task.title}</span>\n        <button class=\"del\">✕</button>`;\n      list.appendChild(li);\n    });\n    const left = tasks.filter((t) => !t.done).length;\n    countEl.textContent = tasks.length ? left + \" of \" + tasks.length + \" left\" : \"\";\n  }\n\n  form.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const text = input.value.trim();\n    if (text === \"\") return;\n    tasks.push({ title: text, done: false });\n    input.value = \"\";\n    save(); render();\n  });\n\n  list.addEventListener(\"click\", (e) => {\n    const li = e.target.closest(\"li\");\n    if (!li) return;\n    const i = Number(li.dataset.i);\n    if (e.target.classList.contains(\"del\")) {\n      tasks.splice(i, 1);                  // remove 1 task at index i\n    } else {\n      tasks[i].done = !tasks[i].done;\n    }\n    save(); render();\n  });\n\n  render();\n<\/script>", "practice": ["Add tasks, then <b>refresh the preview</b>, they're still there!", "Mark some done, refresh, the done state is remembered too.", "Run <code>localStorage.getItem(\"tasks\")</code> in the console to see your data as text."], "gotcha": "Save = <code>JSON.stringify</code>; load = <code>JSON.parse</code>. Call <code>save()</code> after <b>every</b> change, forget it and the browser keeps an old copy."}]}, {"day": "DONE + HOMEWORK", "items": [{"kind": "info", "title": "🎉 You built a full Task Manager", "level": "Bonus", "type": "info", "explain": "<h3>Look what you made.</h3><p>A complete, good-looking app that adds, completes, deletes, and <b>remembers</b> your tasks, built from an array of objects, forms, delegation, and localStorage. Every piece is something you learned this week.</p><p><b>Take-home assignments</b> (with hints) are on the separate sheet. Try them on your finished app, that's where the ideas really stick. Use the hints only after you've tried; a bit of struggle is exactly where the learning happens.</p><p>The pattern behind every feature: <b>change the <code>tasks</code> array, then <code>save()</code> and <code>render()</code>.</b> Hold onto that and you can add almost anything.</p>"}]}];
const flat=[];SEC.forEach(s=>s.items.forEach(it=>flat.push({...it,day:s.day})));
const nav=document.getElementById("nav"),editor=document.getElementById("editor"),output=document.getElementById("output"),
  lessonTitle=document.getElementById("lessonTitle"),lessonBadge=document.getElementById("lessonBadge"),lessonExplain=document.getElementById("lessonExplain"),
  progress=document.getElementById("progress"),workspace=document.getElementById("workspace"),runBtn=document.getElementById("runBtn"),
  resetBtn=document.getElementById("resetBtn"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),runHint=document.getElementById("runHint"),
  codeLabel=document.getElementById("codeLabel");
let current=0,debounce=null;
SEC.forEach(s=>{const label=document.createElement("div");label.className="group-label";label.textContent=s.day;nav.appendChild(label);
  s.items.forEach(it=>{const idx=flat.findIndex(f=>f.title===it.title&&f.day===s.day&&f.explain===it.explain);
    const btn=document.createElement("button");btn.className="nav-item"+(it.kind==="info"?" info":"");btn.dataset.idx=idx;
    btn.innerHTML='<i class="dot d-'+it.level+'"></i>'+it.title+(it.optional?' <span class="opt-tag">opt</span>':'');btn.addEventListener("click",()=>load(idx));nav.appendChild(btn);});});

const CAP='<scr'+'ipt>(function(){var b=[],el=null;function f(v){if(v===null)return "null";if(v===undefined)return "undefined";if(typeof v==="function")return "[function]";if(typeof v==="object"){try{return JSON.stringify(v);}catch(e){return String(v);}}return String(v);}function o(c,a){var s=[].map.call(a,f).join(" ");if(el){var d=document.createElement("div");if(c)d.className=c;d.textContent=s;el.appendChild(d);}else b.push([c,s]);}console.log=function(){o("",arguments);};console.info=console.log;console.error=function(){o("e",arguments);};console.warn=function(){o("w",arguments);};window.addEventListener("error",function(e){o("e",[e.message]);});document.addEventListener("DOMContentLoaded",function(){el=document.getElementById("__con");b.forEach(function(x){var d=document.createElement("div");if(x[0])d.className=x[0];d.textContent=x[1];el.appendChild(d);});b=[];});})();<\/scr'+'ipt>';
const FSTYLE='<style>body{font-family:-apple-system,sans-serif;margin:0;color:#1b1b28}#app{padding:14px}#app:empty{display:none}#__wrap{border-top:1px solid #2a2a3a}#__lbl{background:#12121a;color:#8a8a98;font:600 10px monospace;letter-spacing:.12em;padding:5px 12px}#__con{background:#1e1e2e;color:#e6e6f0;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;padding:8px 12px;white-space:pre-wrap;min-height:34px;line-height:1.55}#__con div{padding:1px 0}#__con .e{color:#ff6b6b}#__con .w{color:#fbbf24}</style>';
function frameDoc(bodyHtml,jsCode){
  var app='<div id="app">'+(bodyHtml||'')+'</div>';
  var box='<div id="__wrap"><div id="__lbl">&#9656; CONSOLE</div><div id="__con"></div></div>';
  var js=jsCode?('<scr'+'ipt>try{\n'+jsCode+'\n}catch(e){console.error(e.message);}<\/scr'+'ipt>'):'';
  return FSTYLE+CAP+app+box+js;
}
function setFrame(doc){output.innerHTML="";var f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-same-origin");output.appendChild(f);f.srcdoc=doc;}
function runJS(code){setFrame(frameDoc("",code));}
function runHTML(code){if(/<!doctype|<html[\s>]/i.test(code)){setFrame(code);}else{setFrame(frameDoc(code,""));}}
function runCurrent(){const it=flat[current];if(it.type==="js")runJS(editor.value);else if(it.type==="html")runHTML(editor.value);}
function load(idx){current=idx;const it=flat[idx];lessonTitle.textContent=it.title;lessonBadge.textContent=it.level;lessonBadge.className="badge-level b-"+it.level;
  let ex=it.explain;
  if(it.optional)ex='<div class="opt-banner"><b>Optional \u00b7 self-study.</b> Not needed for the projects yet. Skip if short on time, or explore on your own.</div>'+ex;
  if(it.practice&&it.practice.length){var where=it.type==="js"?"Type it in your console (F12 \u2192 Console), run each, then make these changes:":"Build it in your <code>index.html</code> + <code>script.js</code> (or edit below), then try these:";ex+='<div class="practice"><div class="pt">\u25b6 Your turn</div><div class="pw">'+where+'</div><ol><li>'+it.practice.join("</li><li>")+'</li></ol></div>';}
  if(it.gotcha)ex+='<div class="gotcha"><b>Gotcha:</b> '+it.gotcha+"</div>";
  lessonExplain.innerHTML=ex;
  progress.textContent=(idx+1)+" / "+flat.length+"  \u00B7  "+it.day;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",Number(b.dataset.idx)===idx));
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===flat.length-1;
  if(it.kind==="info"){workspace.style.display="none";}else{workspace.style.display="grid";editor.value=it.code;codeLabel.textContent=(it.type==="js"?"JavaScript":"HTML + script")+" \u00b7 edit me";runHint.textContent="Ctrl/Cmd+Enter to run";runCurrent();}
  document.querySelector(".content").scrollTop=0;}
editor.addEventListener("input",()=>{if(flat[current].kind==="info")return;clearTimeout(debounce);debounce=setTimeout(runCurrent,400);});
editor.addEventListener("keydown",(e)=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCurrent();}if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);editor.selectionStart=editor.selectionEnd=s+2;}});
runBtn.addEventListener("click",runCurrent);resetBtn.addEventListener("click",()=>{editor.value=flat[current].code;runCurrent();});
prevBtn.addEventListener("click",()=>{if(current>0)load(current-1);});nextBtn.addEventListener("click",()=>{if(current<flat.length-1)load(current+1);});
load(0);
</script></body></html>
