<script>
const SEC = [{"day": "START", "items": [{"kind": "info", "title": "Talking to the Internet", "level": "Start", "type": "info", "explain": "<h3>Today your code phones the outside world.</h3><p>Yesterday you built a full Task Manager. Today, something that feels like magic: your JavaScript will reach out to <b>other computers on the internet</b> and pull back live stuff, photos, jokes, random people, and put it on your page.</p><p>But before we build the fun things, let's <b>really understand three ideas</b>: what an <b>API</b> is, what <b>fetching</b> from the internet is actually like, and what <b>async / await</b> do. Once these click, the code is easy.</p><p>Two practical notes for today: you need to be <b>online</b> (we're truly talking to the internet), and keep the <b>console open</b> (F12) to peek at what comes back.</p>"}]}, {"day": "UNDERSTAND IT FIRST", "items": [{"kind": "info", "title": "1 · What is an API?", "level": "Beginner", "type": "info", "explain": "<h3>An API is a way for programs to ask each other for things.</h3><p><b>API</b> stands for <i>Application Programming Interface</i>, but forget the fancy name. The clearest way to picture it is a <b>waiter in a restaurant</b>.</p><p>You sit at your table (that's your code). You're hungry, for data. You <b>don't</b> march into the kitchen and start cooking; you don't even know how the kitchen works. Instead you tell the <b>waiter</b> (the API) what you'd like from the <b>menu</b>, and the waiter brings it back from the kitchen. You never touch the kitchen, you just need to know how to <b>order</b>.</p><p>A <b>web API</b> works exactly like this. A service, say a weather company, or GitHub, or a dog-photo site, puts some of its data behind <b>web addresses (URLs)</b>. Each URL is like a menu item you can order:</p><ul style='margin:8px 0 8px 20px;line-height:1.9'><li>Ask a weather URL for “Kathmandu” &rarr; it sends back today's temperature.</li><li>Ask a dog service for a photo &rarr; it sends back a link to one.</li><li>Ask GitHub for a username &rarr; it sends back that person's profile.</li></ul><p>You send a <b>request</b> to the URL; the API sends back a <b>response</b>, almost always as <b>JSON</b> (the very same objects and arrays you used to save your tasks yesterday).</p><p><b>Why do APIs exist?</b> So a service can share <i>some</i> of its data safely, without handing you its whole system. It's how apps talk to each other. Every app on your phone is quietly using APIs all day, pulling messages, maps, weather, and prices from servers around the world.</p>"}, {"kind": "info", "title": "2 · What is fetching, and why async / await?", "level": "Beginner", "type": "info", "explain": "<h3>Fetching = send a request across the internet, then wait for the reply.</h3><p>When your code <b>fetches</b>, it sends a small request out to a <b>server</b> (another computer, possibly on the other side of the planet). The server reads your request, gathers the data, and sends a <b>response</b> back. It's a round trip:</p><div style=\"display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0\"><div style=\"background:#ede9fe;border:2px solid #6d5cf6;border-radius:12px;padding:14px 18px;font-weight:600;text-align:center\">💻<br>Your code</div><div style=\"text-align:center;color:#6a6a7d;font-size:.85rem;line-height:1.9\">&rarr;&rarr; request (a URL) &rarr;&rarr;<br>&larr;&larr; response (JSON) &larr;&larr;</div><div style=\"background:#dcfce7;border:2px solid #16a34a;border-radius:12px;padding:14px 18px;font-weight:600;text-align:center\">🌍<br>Server<br><span style=\"font-weight:400;font-size:.74rem\">somewhere far away</span></div></div><p>Here's the key thing: this <b>takes time</b>. Usually just a fraction of a second, sometimes a few seconds, but it is <b>not instant</b>. The data physically travels across the internet, and the server needs a moment to answer.</p><h3>So why <code>async</code> and <code>await</code>?</h3><p>That delay creates a problem. If JavaScript simply <b>stopped and waited</b> for every reply, your whole page would <b>freeze</b>, buttons dead, nothing moving, until the data arrived. That would be awful to use.</p><p>So JavaScript handles slow things <b>asynchronously</b>: it kicks off the task, lets the page keep working, and comes back when the data is ready. <code>async</code> and <code>await</code> are how we write that cleanly:</p><ul style='margin:8px 0 8px 20px;line-height:1.9'><li><code>async</code> marks a function as one that <b>can wait</b> for slow things.</li><li><code>await</code> means <b>“pause right here until this is ready, then carry on”</b>, while the rest of the page stays alive.</li></ul><p><b>Picture making tea while cooking.</b> You put the kettle on (start the fetch), and you <i>don't</i> stand frozen staring at it, you carry on chopping vegetables (the page keeps working). When the kettle whistles (the data arrives), you come back and pour (the <code>await</code> continues). <code>async/await</code> lets you <b>write</b> this as simple top-to-bottom steps, while the “don't freeze” part happens for you automatically.</p><p>That's why the pattern uses <b>two</b> <code>await</code>s: <code>await fetch(url)</code> (“ask, and wait for the reply”) and <code>await res.json()</code> (“wait while we read that reply into usable data”).</p>"}]}, {"day": "THE PATTERN IN ACTION", "items": [{"kind": "lesson", "title": "3 · The three-line pattern", "level": "Beginner", "type": "html", "explain": "Now that you know <i>what</i> is happening, here's the code, and it's always the same three lines:</p><pre><code>async function getData() {\n  const res = await fetch(URL);   // ask, and wait for the reply\n  const data = await res.json();  // turn the reply into usable data\n  console.log(data);              // now use it\n}</code></pre><p>Let's point it at a free <b>dog API</b> and just look at what it sends back. Click the button, then read the console, you'll see the JSON, the same shape we talked about.", "code": "<button id=\"btn\">Get data</button>\n\n<script>\n  async function getDog() {\n    const res = await fetch(\"https://dog.ceo/api/breeds/image/random\");\n    const data = await res.json();\n    console.log(data);   // 👀 open the console (F12)!\n  }\n\n  document.querySelector(\"#btn\").addEventListener(\"click\", getDog);\n<\/script>", "practice": ["Click, then read the reply in the console, see the <code>message</code> and <code>status</code> fields.", "That <code>message</code> field is a link to a dog photo, we'll use it next.", "Click again a few times: a different photo link each time."], "gotcha": "Two <code>await</code>s, one for <code>fetch</code> (get the reply), one for <code>res.json()</code> (read it). Both only work inside an <code>async</code> function. Nothing happening? Check you're online and the console is open."}, {"kind": "lesson", "title": "4 · Reading the data (dots & nesting)", "level": "Beginner", "type": "html", "explain": "<h3>The dots aren't magic, they're a path.</h3><p>When data comes back, it's often <b>boxes inside boxes</b>, an object with objects (and arrays) inside it. The dots just walk you in, one box at a time. The secret every developer uses: <b>log the whole thing first, look at the shape, then follow the dots.</b></p><p>Watch it peel open, layer by layer. Each <code>console.log</code> below goes one level deeper. Read the console top to bottom and you'll <i>see</i> where each dot takes you:</p><pre><code>data                 &rarr; the whole reply (a big object)\ndata.message         &rarr; reach INTO data, grab the \"message\" box\ndata.slip            &rarr; reach into data, grab the \"slip\" box (another object!)\ndata.slip.advice     &rarr; then reach into slip, grab \"advice\"</code></pre><p><b>Arrays add a number in [ ]:</b> if a box is a <i>list</i>, <code>[0]</code> means “the first one.” So <code>data.results[0].name.first</code> reads left-to-right as: <i>data &rarr; its results list &rarr; the first one &rarr; its name &rarr; the first name.</i> Just follow the path.</p><p>Run this, it fetches advice and logs each level so you can watch the dots dig in:</p>", "code": "<button id=\"btn\">Peel the data 🧅</button>\n<p id=\"out\"></p>\n\n<script>\n  async function peel() {\n    const res = await fetch(\"https://api.adviceslip.com/advice\");\n    const data = await res.json();\n\n    // 👀 open the console and read these top to bottom:\n    console.log(\"1. the whole thing:\", data);\n    console.log(\"2. one level in  :\", data.slip);\n    console.log(\"3. the value     :\", data.slip.advice);\n\n    // now that we know the path, use it:\n    document.querySelector(\"#out\").textContent = data.slip.advice;\n  }\n  document.querySelector(\"#btn\").addEventListener(\"click\", peel);\n<\/script>", "practice": ["Click, then read the three console lines, see how each dot goes one box deeper.", "Line 1 shows <code>{ slip: {...} }</code>. Line 2 shows what's <i>inside</i> slip. Line 3 is the actual text.", "Add <code>console.log(typeof data.slip)</code>, it's an <code>\"object\"</code> (a box), which is why you can dot into it again.", "<b>Golden rule:</b> whenever you're unsure, <code>console.log(data)</code> first and follow the boxes."], "gotcha": "A dot means “go inside this box.” You can only dot into an <b>object</b>. If a box is a <b>list</b> (array), put a number in <code>[ ]</code> first (<code>[0]</code> = first item), <i>then</i> keep dotting. When a dot gives <code>undefined</code>, you took a wrong turn, log the level above it to see what's really there."}]}, {"day": "BUILD FUN THINGS", "items": [{"kind": "lesson", "title": "🐶 Random Dog", "level": "Beginner", "type": "html", "explain": "Now <b>use</b> the data instead of just logging it. The reply's <code>message</code> field is the photo's link, drop it into an <code>&lt;img&gt;</code>'s <code>src</code> and a real dog appears. Same three-line pattern, one line to show it.<p style='margin-top:10px'><b>The path here:</b> <code>data</code> &rarr; <code>data.message</code> (the photo link). Only one level deep, easy.</p>", "code": "<button id=\"btn\">New dog 🐶</button>\n<br><br>\n<img id=\"dog\" width=\"300\" style=\"border-radius:12px\">\n\n<script>\n  async function getDog() {\n    const res = await fetch(\"https://dog.ceo/api/breeds/image/random\");\n    const data = await res.json();\n    console.log(\"data:\", data);   // 👀 look: it has a \"message\" field\n    document.querySelector(\"#dog\").src = data.message;  // the photo link\n  }\n\n  document.querySelector(\"#btn\").addEventListener(\"click\", getDog);\n  getDog();   // load one straight away\n<\/script>", "practice": ["Click “New dog” a few times.", "Change the image <code>width</code>.", "Remove the <code>getDog();</code> at the bottom, now nothing shows until you click (that line loads one on start)."], "gotcha": "<code>data.message</code> is the photo's URL. Putting a URL into an <code>&lt;img&gt;</code>'s <code>src</code> is all it takes to show an image from the internet."}, {"kind": "lesson", "title": "✨ Random Advice", "level": "Beginner", "type": "html", "explain": "Same pattern, a different API, this one gives life advice. Notice the data is <b>nested</b>: the advice sits at <code>data.slip.advice</code> (an object inside an object). Read it, show it.<p style='margin-top:10px'><b>The path here:</b> <code>data</code> &rarr; <code>data.slip</code> (a box) &rarr; <code>data.slip.advice</code> (the text). Two levels, follow the dots.</p>", "code": "<button id=\"btn\">Give me advice ✨</button>\n<p id=\"advice\" style=\"font-size:1.2rem; font-style:italic; color:#4b3f8f\"></p>\n\n<script>\n  async function getAdvice() {\n    const res = await fetch(\"https://api.adviceslip.com/advice\");\n    const data = await res.json();\n    console.log(\"data:\", data);   // 👀 a \"slip\" box, with \"advice\" inside it\n    document.querySelector(\"#advice\").textContent = data.slip.advice;\n  }\n\n  document.querySelector(\"#btn\").addEventListener(\"click\", getAdvice);\n  getAdvice();\n<\/script>", "practice": ["Click for a new piece of advice.", "Add <code>console.log(data)</code> to see the whole reply and find where <code>advice</code> lives.", "Make the text bigger or change its colour."], "gotcha": "<code>data.slip.advice</code>, dots reach inside nested objects. Unsure of the path? Log the data first; the console shows you the exact shape."}, {"kind": "lesson", "title": "👋 Meet a Random Person", "level": "Beginner", "type": "html", "explain": "One more, a random made-up person with photo, name and email. Here the data arrives as an <b>array</b> holding one person, so we grab <code>data.results[0]</code> first, then build a little card with a template literal (like your Task Manager rows).<p style='margin-top:10px'><b>The path here:</b> <code>data</code> &rarr; <code>data.results</code> (a <i>list</i>) &rarr; <code>data.results[0]</code> (the first person) &rarr; then dot in: <code>.name.first</code>, <code>.email</code>. That <code>[0]</code> is there because results is a list.</p>", "code": "<button id=\"btn\">Meet someone 👋</button>\n<div id=\"person\" style=\"margin-top:14px\"></div>\n\n<script>\n  async function getPerson() {\n    const res = await fetch(\"https://randomuser.me/api/\");\n    const data = await res.json();\n    console.log(\"data:\", data);            // 👀 has a \"results\" LIST\n    console.log(\"first person:\", data.results[0]);  // dig one in\n    const user = data.results[0];         // the array's first (only) person\n    document.querySelector(\"#person\").innerHTML = `\n      <img src=\"${user.picture.large}\" style=\"border-radius:50%\">\n      <h3>${user.name.first} ${user.name.last}</h3>\n      <p>${user.email}</p>`;\n  }\n\n  document.querySelector(\"#btn\").addEventListener(\"click\", getPerson);\n  getPerson();\n<\/script>", "practice": ["Click to meet a new person each time.", "<code>console.log(user)</code> and explore, try adding <code>user.location.country</code>.", "Add the person's phone number under their email."], "gotcha": "<code>data.results</code> is an <b>array</b>, so <code>[0]</code> grabs the first person. Then it's dot-access all the way: <code>user.name.first</code>, <code>user.email</code>, etc."}, {"kind": "lesson", "title": "🕷️ Spider-Tracker", "level": "Beginner", "type": "html", "explain": "Spidey time. This one talks to a free <b>superhero API</b>, you give it a hero's <b>ID number</b> and it sends back their photo, real name and power stats. Spider-Man is <b>ID 620</b>. Same three-line pattern; the only new thing is the data is <b>deeply nested</b>, so you'll dot your way in: <code>hero.images.lg</code>, <code>hero.powerstats.strength</code>, <code>hero.biography.fullName</code>. The 🎲 button grabs a random hero so you can discover others.<p style='margin-top:10px'><b>The path here:</b> <code>hero</code> &rarr; <code>hero.powerstats</code> (a box) &rarr; <code>hero.powerstats.strength</code>. And <code>hero.images.lg</code>, <code>hero.biography.fullName</code>. Deeply nested, so <b>log <code>hero</code> first</b> and follow each dot.</p>", "code": "<button id=\"spidey\">🕷️ Spider-Man</button>\n<button id=\"random\">🎲 Random hero</button>\n<div id=\"hero\" style=\"margin-top:14px\"></div>\n\n<script>\n  async function getHero(id) {\n    const res = await fetch(\"https://akabab.github.io/superhero-api/api/id/\" + id + \".json\");\n    const hero = await res.json();\n    console.log(\"hero:\", hero);   // 👀 boxes inside boxes: powerstats, images, biography...\n    document.querySelector(\"#hero\").innerHTML = `\n      <img src=\"${hero.images.lg}\" width=\"170\" style=\"border-radius:12px\">\n      <h3>${hero.name}</h3>\n      <p>Real name: ${hero.biography.fullName || \"unknown\"}</p>\n      <p>💪 Strength ${hero.powerstats.strength} · ⚡ Speed ${hero.powerstats.speed} · 🧠 Intelligence ${hero.powerstats.intelligence}</p>`;\n  }\n\n  document.querySelector(\"#spidey\").addEventListener(\"click\", () => getHero(620));\n  document.querySelector(\"#random\").addEventListener(\"click\", () => {\n    const id = Math.floor(Math.random() * 731) + 1;   // heroes are 1 to 731\n    getHero(id);\n  });\n\n  getHero(620);   // Spider-Man loads first\n<\/script>", "practice": ["Click 🕷️ Spider-Man, then 🎲 Random hero a few times to meet others.", "<code>console.log(hero)</code> and explore, add more stats like <code>hero.powerstats.combat</code> or <code>hero.powerstats.power</code>.", "Change <code>getHero(620)</code> to another number (try 213, 346, 149) to find a specific hero.", "Show the hero's publisher: <code>hero.biography.publisher</code> (Marvel or DC!)."], "gotcha": "The data is <b>deeply nested</b>, so you reach in with dots: <code>hero.powerstats.strength</code>, <code>hero.images.lg</code>. Log the whole <code>hero</code> to see the full shape. Some heroes have <code>\"unknown\"</code> for missing fields, that's why we use <code>|| \"unknown\"</code> as a fallback."}]}, {"day": "EXPLORE", "items": [{"kind": "info", "title": "More free APIs to play with", "level": "Bonus", "type": "info", "explain": "<h3>Same pattern, endless fun.</h3><p>Every one of these uses the <b>exact three lines</b> you just learned, only the URL and field names change. Log the data first to find what to use. All free, no sign-up:</p><ul style='margin:6px 0 0 18px;line-height:2'><li>🐱 <b>Cat photo:</b> <code>https://cataas.com/cat?json=true</code></li><li>😂 <b>Random joke:</b> <code>https://official-joke-api.appspot.com/random_joke</code> (<code>setup</code> + <code>punchline</code>)</li><li>🔢 <b>Number fact:</b> <code>http://numbersapi.com/random/trivia</code></li><li>🎲 <b>Something to do:</b> <code>https://www.boredapi.com/api/activity</code></li><li>🦸 <b>Superheroes:</b> <code>https://akabab.github.io/superhero-api/api/id/620.json</code> (change the number 1–731!)</li><li>🐿️ <b>Pokémon:</b> <code>https://pokeapi.co/api/v2/pokemon/pikachu</code></li></ul><p style='margin-top:12px'>The recipe every time: <b>fetch the URL &rarr; <code>await res.json()</code> &rarr; log it &rarr; pick the field you want.</b></p>"}]}, {"day": "YOUR TURN", "items": [{"kind": "info", "title": "Try it yourself 🚀", "level": "Bonus", "type": "info", "explain": "<h3>Small challenges, big fun.</h3><p>Pick one or two, they all reuse today's pattern:</p><ul style='margin:6px 0 0 18px;line-height:1.95'><li><b>Joke teller:</b> fetch a joke, show the <code>setup</code>, reveal the <code>punchline</code> on a second button click.</li><li><b>Dog + advice combo:</b> one button that shows a random dog <i>and</i> a piece of advice together.</li><li><b>Fuller person card:</b> photo, name, email, country and phone, styled like a contact card.</li><li><b>Pokémon peek:</b> fetch <code>pikachu</code>, show its name and one of its <code>types</code>. (Log the data, it's big, hunt for the field.)</li></ul><p style='margin-top:12px'><b>Stuck?</b> Always <code>console.log(data)</code> first to see the shape, then follow the dots to the field. And remember: <code>fetch</code> &rarr; <code>await res.json()</code> &rarr; use it.</p>"}]}];
const flat=[];SEC.forEach(s=>s.items.forEach(it=>flat.push({...it,day:s.day})));
const nav=document.getElementById("nav"),editor=document.getElementById("editor"),output=document.getElementById("output"),
  lessonTitle=document.getElementById("lessonTitle"),lessonBadge=document.getElementById("lessonBadge"),lessonExplain=document.getElementById("lessonExplain"),
  progress=document.getElementById("progress"),workspace=document.getElementById("workspace"),runBtn=document.getElementById("runBtn"),
  resetBtn=document.getElementById("resetBtn"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),runHint=document.getElementById("runHint"),
  codeLabel=document.getElementById("codeLabel");
let current=0,debounce=null;
SEC.forEach(s=>{const label=document.createElement("div");label.className="group-label";label.textContent=s.day;nav.appendChild(label);
  s.items.forEach(it=>{const idx=flat.findIndex(f=>f.title===it.title&&f.day===s.day&&f.explain===it.explain);
    const btn=document.createElement("button");btn.className="nav-item"+(it.kind==="info"?" info":"");btn.dataset.idx=idx;
    btn.innerHTML='<i class="dot d-'+it.level+'"></i>'+it.title+(it.optional?' <span class="opt-tag">opt</span>':'');btn.addEventListener("click",()=>load(idx));nav.appendChild(btn);});});

const CAP='<scr'+'ipt>(function(){var b=[],el=null;function f(v){if(v===null)return "null";if(v===undefined)return "undefined";if(typeof v==="function")return "[function]";if(typeof v==="object"){try{return JSON.stringify(v);}catch(e){return String(v);}}return String(v);}function o(c,a){var s=[].map.call(a,f).join(" ");if(el){var d=document.createElement("div");if(c)d.className=c;d.textContent=s;el.appendChild(d);}else b.push([c,s]);}console.log=function(){o("",arguments);};console.info=console.log;console.error=function(){o("e",arguments);};console.warn=function(){o("w",arguments);};window.addEventListener("error",function(e){o("e",[e.message]);});document.addEventListener("DOMContentLoaded",function(){el=document.getElementById("__con");b.forEach(function(x){var d=document.createElement("div");if(x[0])d.className=x[0];d.textContent=x[1];el.appendChild(d);});b=[];});})();<\/scr'+'ipt>';
const FSTYLE='<style>body{font-family:-apple-system,sans-serif;margin:0;color:#1b1b28}#app{padding:14px}#app:empty{display:none}#__wrap{border-top:1px solid #2a2a3a}#__lbl{background:#12121a;color:#8a8a98;font:600 10px monospace;letter-spacing:.12em;padding:5px 12px}#__con{background:#1e1e2e;color:#e6e6f0;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;padding:8px 12px;white-space:pre-wrap;min-height:34px;line-height:1.55}#__con div{padding:1px 0}#__con .e{color:#ff6b6b}#__con .w{color:#fbbf24}</style>';
function frameDoc(bodyHtml,jsCode){
  var app='<div id="app">'+(bodyHtml||'')+'</div>';
  var box='<div id="__wrap"><div id="__lbl">&#9656; CONSOLE</div><div id="__con"></div></div>';
  var js=jsCode?('<scr'+'ipt>try{\n'+jsCode+'\n}catch(e){console.error(e.message);}<\/scr'+'ipt>'):'';
  return FSTYLE+CAP+app+box+js;
}
function setFrame(doc){output.innerHTML="";var f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-same-origin");output.appendChild(f);f.srcdoc=doc;}
function runJS(code){setFrame(frameDoc("",code));}
function runHTML(code){if(/<!doctype|<html[\s>]/i.test(code)){setFrame(code);}else{setFrame(frameDoc(code,""));}}
function runCurrent(){const it=flat[current];if(it.type==="js")runJS(editor.value);else if(it.type==="html")runHTML(editor.value);}
function load(idx){current=idx;const it=flat[idx];lessonTitle.textContent=it.title;lessonBadge.textContent=it.level;lessonBadge.className="badge-level b-"+it.level;
  let ex=it.explain;
  if(it.optional)ex='<div class="opt-banner"><b>Optional \u00b7 self-study.</b> Not needed for the projects yet. Skip if short on time, or explore on your own.</div>'+ex;
  if(it.practice&&it.practice.length){var where=it.type==="js"?"Type it in your console (F12 \u2192 Console), run each, then make these changes:":"Build it in your <code>index.html</code> + <code>script.js</code> (or edit below), then try these:";ex+='<div class="practice"><div class="pt">\u25b6 Your turn</div><div class="pw">'+where+'</div><ol><li>'+it.practice.join("</li><li>")+'</li></ol></div>';}
  if(it.gotcha)ex+='<div class="gotcha"><b>Gotcha:</b> '+it.gotcha+"</div>";
  lessonExplain.innerHTML=ex;
  progress.textContent=(idx+1)+" / "+flat.length+"  \u00B7  "+it.day;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",Number(b.dataset.idx)===idx));
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===flat.length-1;
  if(it.kind==="info"){workspace.style.display="none";}else{workspace.style.display="grid";editor.value=it.code;codeLabel.textContent=(it.type==="js"?"JavaScript":"HTML + script")+" \u00b7 edit me";runHint.textContent="Ctrl/Cmd+Enter to run";runCurrent();}
  document.querySelector(".content").scrollTop=0;}
editor.addEventListener("input",()=>{if(flat[current].kind==="info")return;clearTimeout(debounce);debounce=setTimeout(runCurrent,400);});
editor.addEventListener("keydown",(e)=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCurrent();}if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);editor.selectionStart=editor.selectionEnd=s+2;}});
runBtn.addEventListener("click",runCurrent);resetBtn.addEventListener("click",()=>{editor.value=flat[current].code;runCurrent();});
prevBtn.addEventListener("click",()=>{if(current>0)load(current-1);});nextBtn.addEventListener("click",()=>{if(current<flat.length-1)load(current+1);});
load(0);
</script></body></html>
