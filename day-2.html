<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 2 · CSS</title>
<style>
  :root{--bg:#f7f6fb;--surface:#fff;--ink:#1b1b28;--muted:#6a6a7d;--accent:#6d5cf6;--accent-soft:#efeaff;--border:#e7e5f0;--code-bg:#1e1e2e;--code-ink:#e6e6f0;--beg:#15803d;--beg-bg:#dcfce7;--int:#b45309;--int-bg:#fef3c7;--adv:#6d28d9;--adv-bg:#ede9fe;--bon:#a16207;--bon-bg:#fef9c3;--ov:#4338ca;--ov-bg:#e0e7ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden}
  .sidebar{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:18px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .brand h1{font-size:1rem;font-weight:700}
  .brand .accent{color:var(--accent);font-family:monospace}
  .brand p{font-size:.72rem;color:var(--muted);margin-top:4px}
  .group-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:15px 18px 5px}
  .nav-item{display:flex;align-items:center;width:100%;text-align:left;background:none;border:none;padding:6px 16px 6px 20px;font-size:.82rem;color:var(--muted);cursor:pointer;border-left:3px solid transparent;gap:8px}
  .nav-item:hover{background:var(--bg);color:var(--ink)}
  .nav-item.active{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  .nav-item.info{color:#4338ca;font-style:italic}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;background:#ccc}
  .d-Beginner{background:var(--beg)}.d-Intermediate{background:var(--int)}.d-Advanced{background:var(--adv)}.d-Bonus{background:var(--bon)}.d-Recap,.d-Today{background:var(--ov)}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 26px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
  .progress{font-size:.8rem;color:var(--muted);font-family:monospace}
  .navbtns{display:flex;gap:8px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#5a49e0;color:#fff}
  .content{flex:1;overflow-y:auto;padding:30px 40px 60px}
  .title-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .lesson-title{font-size:1.6rem}
  .badge-level{font-size:.6rem;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .b-Beginner{background:var(--beg-bg);color:var(--beg)}.b-Intermediate{background:var(--int-bg);color:var(--int)}.b-Advanced{background:var(--adv-bg);color:var(--adv)}.b-Bonus{background:var(--bon-bg);color:var(--bon)}.b-Recap,.b-Today{background:var(--ov-bg);color:var(--ov)}
  .explain{font-size:1.02rem;line-height:1.7;max-width:820px}
  .explain code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;font-size:.9em}
  .explain p{margin-bottom:12px}
  .explain h3{font-size:1.35rem;margin:4px 0 14px}
  .gotcha{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 14px;margin:14px 0 4px;font-size:.9rem;max-width:820px}
  .gotcha b{color:#c2410c}
  .opt-banner{background:#f3f4f6;border:1px solid #d1d5db;border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:.85rem;color:#4b5563;max-width:820px}
  .opt-banner b{color:#374151}
  .opt-tag{font-size:.58rem;color:#9ca3af;border:1px solid #e5e7eb;border-radius:4px;padding:0 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
  .workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .pane{display:flex;flex-direction:column}
  .pane-head{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:700}
  .run-row{display:flex;gap:8px;align-items:center}
  .hint{font-size:.68rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
  textarea.editor{width:100%;min-height:380px;background:var(--code-bg);color:var(--code-ink);border:none;border-radius:10px;padding:16px;font-family:"SF Mono","Consolas",monospace;font-size:.84rem;line-height:1.6;resize:vertical;tab-size:2;outline:none}
  .output{min-height:380px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .output iframe{width:100%;height:100%;min-height:380px;border:none;background:#fff}
  @media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{width:210px}}

<script>
const SEC = [{"day": "RECAP", "items": [{"kind": "info", "title": "From yesterday to today", "level": "Recap", "type": "info", "explain": "<h3>Yesterday you built. Today you make it beautiful.</h3><p>Yesterday you learned <b>HTML</b>, the structure of a page. You built an About Me page with headings, lists, links and a form. But it was plain: black text on a white background.</p><p>Today you learn <b>CSS</b>, the language that styles that structure: colours, spacing, fonts, borders, and full page layouts. Everything today styles the <b>same tags you already know</b> (<code>h1</code>, <code>p</code>, <code>div</code>, <code>ul</code>...).</p><p><b>We'll cover:</b> how to add CSS, selectors, colours, the box model, spacing, text &amp; fonts, display, position, flexbox, grid, responsive design, and effects like transitions and animations.</p><p><b>Your build task:</b> take yesterday's plain About Me page and <b>style it</b>, until it's something you're proud to show. The final ⭐ bonus gives you a full styled portfolio to start from.</p>"}]}, {"day": "CSS BASICS", "items": [{"kind": "lesson", "title": "1 · How to add CSS", "level": "Beginner", "type": "html", "explain": "CSS styles your HTML. There are three places to put it, and knowing all three matters.<br><br><b>1. Inline</b> &mdash; a <code>style</code> attribute on a single element: <code>&lt;p style=\"color:red\"&gt;</code>. Quick, but it can't be reused, and it can't do <code>:hover</code> or media queries. Use only for a fast test.<br><b>2. Internal</b> &mdash; a <code>&lt;style&gt;</code> block in the <code>&lt;head&gt;</code>. Styles that one page. <b>This is what our lessons use</b>, so the code and its result sit together.<br><b>3. External</b> &mdash; a separate <code>style.css</code> file linked with <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Styles your whole site, and is <b>what you'll use for real projects</b>, including Project 1.<br><br>Below, internal CSS styles the same <code>&lt;h1&gt;</code> and <code>&lt;p&gt;</code> from yesterday. Change <code>purple</code> to any colour and watch it update.", "code": "<style>\n  h1 { color: purple; }\n  p { color: gray; }\n</style>\n\n<h1>Now with colour!</h1>\n<p>Yesterday this was plain black. Today, CSS.</p>", "gotcha": "Inline beats internal and external. Between internal and external, whichever comes <b>later</b> wins. Avoid <code>!important</code>, it makes future changes painful."}, {"kind": "lesson", "title": "2 · CSS syntax & comments", "level": "Beginner", "type": "html", "explain": "Every CSS rule has the same shape. A <b>selector</b> picks what to style, then <code>{ }</code> holds one or more <b>declarations</b>, and each declaration is a <code>property: value;</code> pair ending in a semicolon.<div style=\"margin:14px 0;font-family:monospace;font-size:1.15rem;background:#1e1e2e;padding:16px;border-radius:10px;color:#e6e6f0;text-align:center\"><span style=\"color:#f59e0b\">h1</span> <span style=\"color:#a5a4b8\">{</span> <span style=\"color:#6d5cf6\">color</span><span style=\"color:#a5a4b8\">:</span> <span style=\"color:#4ade80\">teal</span><span style=\"color:#a5a4b8\">;</span> <span style=\"color:#a5a4b8\">}</span></div><div style=\"display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem;margin-bottom:6px\"><span><b style=\"color:#f59e0b\">selector</b> &#8594; what to style</span><span><b style=\"color:#6d5cf6\">property</b> &#8594; what to change</span><span><b style=\"color:#4ade80\">value</b> &#8594; the setting</span><span>the whole <b style=\"color:#6d5cf6\">color: teal;</b> is one <b>declaration</b></span></div>The semicolon after every value matters, forget it and the next line breaks. A comment is <code>/* like this */</code> and the browser ignores it; use comments to label sections of a big stylesheet. Read the example as: \"select every h1, make its text teal and its size 40 pixels.\"", "code": "<style>\n  h1 {\n    color: teal;        /* the text colour */\n    font-size: 40px;    /* how big */\n  }\n</style>\n<h1>Read the CSS on the left</h1>"}, {"kind": "lesson", "title": "3 · Selectors", "level": "Beginner", "type": "html", "explain": "Selectors choose <b>what</b> to style, and there are three you'll use constantly:<br><br>&bull; By <b>tag</b>: <code>p</code> styles <b>every</b> paragraph on the page.<br>&bull; By <b>class</b>: <code>.highlight</code> styles any element with <code>class=\"highlight\"</code>. Classes are <b>reusable</b>, put the same class on many elements. Use these the most.<br>&bull; By <b>id</b>: <code>#special</code> styles the <b>one</b> element with <code>id=\"special\"</code>. Ids must be unique.<br><br>Remember classes and ids from yesterday's HTML? This is exactly what they were for. You can also <b>group</b> selectors with a comma, <code>h1, h2</code>, to give several the same style at once.", "code": "<style>\n  p { color: gray; }\n  .highlight { color: green; font-weight: bold; }\n  #special { color: purple; }\n  h1, h2 { font-family: sans-serif; }\n</style>\n<h1>Heading</h1>\n<p>Normal paragraph.</p>\n<p class=\"highlight\">Class paragraph.</p>\n<p id=\"special\">Id paragraph.</p>"}, {"kind": "lesson", "title": "4 · Colours & backgrounds", "level": "Beginner", "type": "html", "explain": "<code>color</code> sets the text colour; <code>background-color</code> (or the shorthand <code>background</code>) sets the box's fill. There are three common ways to write a colour:<br><br>&bull; a <b>name</b>: <code>red</code>, <code>teal</code>, <code>tomato</code><br>&bull; a <b>hex</b> code: <code>#6d5cf6</code> (the most common in real code)<br>&bull; <b>rgb</b>: <code>rgb(109, 92, 246)</code>, or <code>rgba(..., 0.5)</code> to add transparency<br><br>For a background you can also use a <code>linear-gradient()</code>, which blends between colours. Try changing the hex codes below to your own colours.", "code": "<style>\n  .card {\n    background-color: #6d5cf6;\n    color: white;\n    padding: 20px;\n  }\n  .gradient {\n    background: linear-gradient(135deg, #6d5cf6, #f59e0b);\n    color: white; padding: 20px; margin-top: 8px;\n  }\n</style>\n<div class=\"card\">Solid background</div>\n<div class=\"gradient\">Gradient background</div>"}]}, {"day": "THE BOX MODEL", "items": [{"kind": "lesson", "title": "5 · The box model", "level": "Beginner", "type": "html", "explain": "This is the single most important idea in CSS layout. <b>Every element is a box</b> made of four layers, from the inside out: the <b>content</b>, the <b>padding</b> (space inside, around the content), the <b>border</b>, and the <b>margin</b> (space outside, pushing other boxes away).<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 250\" width=\"100%\" style=\"max-width:440px\"><rect x=\"3\" y=\"3\" width=\"454\" height=\"244\" fill=\"#fef3c7\" stroke=\"#f59e0b\" stroke-dasharray=\"5\"/><text x=\"10\" y=\"20\" font-size=\"12\" fill=\"#b45309\" font-family=\"monospace\">margin (space outside)</text><rect x=\"55\" y=\"42\" width=\"350\" height=\"166\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\" stroke-width=\"4\"/><text x=\"63\" y=\"60\" font-size=\"12\" fill=\"#4338ca\" font-family=\"monospace\">border</text><rect x=\"88\" y=\"70\" width=\"284\" height=\"110\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-dasharray=\"4\"/><text x=\"96\" y=\"87\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">padding (space inside)</text><rect x=\"150\" y=\"98\" width=\"160\" height=\"54\" fill=\"#6d5cf6\"/><text x=\"182\" y=\"130\" font-size=\"13\" fill=\"#fff\" font-family=\"monospace\">content</text></svg></div>Those four layers are not just names, they <b>behave differently</b>, and that is what makes them useful:<ul><li><b>Content</b> &mdash; your text or image. Its size comes from <code>width</code> and <code>height</code>, or from the content itself if you set neither.</li><li><b>Padding</b> &mdash; transparent space, but it <b>is painted with the element's background</b>. So a purple card with <code>padding: 20px</code> stays purple right out to the border. Padding is what stops text from touching the edge of a card or a button.</li><li><b>Border</b> &mdash; a visible line drawn around the padding. It takes up real space, which is why it matters in the maths below.</li><li><b>Margin</b> &mdash; space <b>outside</b> the border. It is always fully transparent (the parent's background shows through), and it never belongs to the element itself. Margin is how you push other boxes away.</li></ul>A quick way to remember it: <b>padding pushes the border away from the content, margin pushes other elements away from the border</b>.<br><br>Here's the catch that trips up every beginner: by default, <code>width</code> sets only the <b>content</b>, so padding and border get <b>added on top</b>, making the box wider than the number you wrote. Do the maths on our example, with <code>width: 220px</code>, <code>padding: 20px</code> and <code>border: 4px</code>:<br><br><code>220 + 20 (left pad) + 20 (right pad) + 4 (left border) + 4 (right border) = <b>268px</b></code><br><br>You asked for 220 and got 268. Put four of those side by side in a 1000px row expecting them to fit, and they won't. This default is called <code>box-sizing: content-box</code>, and it is the source of countless \"why is my layout overflowing?\" bugs.<br><br>The one-line fix is <code>box-sizing: border-box</code>. It tells the browser that <code>width</code> should include the padding and border, and it shrinks the content area to make room. Same declarations as above, but now:<br><br><code>content 172px + 40px padding + 8px border = <b>220px</b></code>, exactly what you asked for.<br><br>Notice that nothing was removed, the box just <b>redistributes</b> the 220px internally. <code>height</code> works the same way. <b>Margin is never included either way</b>, it always sits outside the number, so a 220px border-box box with <code>margin: 16px</code> still occupies 252px of horizontal room in its parent.<br><br>Delete the <code>box-sizing</code> line in the example and watch the box jump from 220px to 268px. Then, in your browser, right-click the box and choose <b>Inspect</b>: DevTools draws this exact diagram, in these exact colours, with the live numbers for every layer. That panel is the fastest way to answer \"why is there a gap here?\" for the rest of your career.", "code": "<style>\n  .box {\n    width: 220px;\n    padding: 20px;\n    border: 4px solid #6d5cf6;\n    margin: 16px;\n    background: #efeaff;\n    box-sizing: border-box;\n  }\n</style>\n<div class=\"box\">220px wide, thanks to border-box.</div>", "gotcha": "Put <code>* { box-sizing: border-box; }</code> at the top of every project. It makes sizing behave the way you expect."}, {"kind": "lesson", "title": "6 · Borders & rounded corners", "level": "Beginner", "type": "html", "explain": "<code>border</code> is a shorthand for three things at once: <b>width</b>, <b>style</b>, and <b>colour</b>, written as <code>3px solid #6d5cf6</code>. Common styles are <code>solid</code>, <code>dashed</code>, and <code>dotted</code>.<br><br><code>border-radius</code> rounds the corners: a small value softens them, and <code>50%</code> turns a square into a perfect circle (see the last box). You can also target one side, like <code>border-bottom: 2px solid gray</code>, which is a clean way to underline a heading. Try changing <code>solid</code> to <code>dashed</code> and the radius numbers.", "code": "<style>\n  .a { border: 3px solid #6d5cf6; padding: 12px; margin-bottom: 8px; }\n  .b { border: 2px dashed gray; border-radius: 12px; padding: 12px; margin-bottom: 8px; }\n  .circle { width: 80px; height: 80px; background: #6d5cf6; border-radius: 50%; }\n</style>\n<div class=\"a\">Solid border</div>\n<div class=\"b\">Dashed, rounded</div>\n<div class=\"circle\"></div>"}, {"kind": "lesson", "title": "7 · Margin & padding", "level": "Beginner", "type": "html", "explain": "These two control spacing, and mixing them up is the most common beginner bug. <b>Padding</b> is the space <b>inside</b> the border, between the content and the edge. <b>Margin</b> is the space <b>outside</b>, the gap that pushes neighbouring elements away.<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 470 210\" width=\"100%\" style=\"max-width:450px\"><rect x=\"70\" y=\"8\" width=\"330\" height=\"78\" fill=\"#fff\" stroke=\"#6d5cf6\" stroke-width=\"2\"/><rect x=\"105\" y=\"28\" width=\"260\" height=\"38\" fill=\"#e0e7ff\"/><text x=\"150\" y=\"52\" font-size=\"12\" fill=\"#4338ca\" font-family=\"monospace\">content</text><line x1=\"105\" y1=\"20\" x2=\"105\" y2=\"66\" stroke=\"#15803d\" stroke-width=\"1\"/><text x=\"112\" y=\"18\" font-size=\"11\" fill=\"#15803d\" font-family=\"monospace\">padding = inside the border</text><line x1=\"235\" y1=\"86\" x2=\"235\" y2=\"130\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"4\"/><text x=\"245\" y=\"112\" font-size=\"11\" fill=\"#b45309\" font-family=\"monospace\">margin = gap outside, between boxes</text><rect x=\"70\" y=\"130\" width=\"330\" height=\"60\" fill=\"#fff\" stroke=\"#6d5cf6\" stroke-width=\"2\"/><text x=\"150\" y=\"166\" font-size=\"12\" fill=\"#6a6a7d\" font-family=\"monospace\">the next box</text></svg></div>Both can be written several ways: one value for all sides (<code>padding: 20px</code>), a single side (<code>margin-top: 10px</code>), or four values in the order <b>top right bottom left</b> (<code>margin: 10px 20px 10px 20px</code>). Rule of thumb: use <b>padding</b> to give content breathing room inside a box, and <b>margin</b> to create space between boxes.", "code": "<style>\n  .box { background: #efeaff; border: 1px solid #6d5cf6; margin-bottom: 8px; }\n  .p { padding: 24px; }\n  .m { margin: 24px; }\n</style>\n<div class=\"box p\">Lots of padding (inner space).</div>\n<div class=\"box m\">Lots of margin (outer space).</div>", "gotcha": "Vertical margins between two elements <b>collapse</b> into one (they don't add up). Surprising, but normal."}, {"kind": "lesson", "title": "8 · Width & height", "level": "Beginner", "type": "html", "explain": "<code>width</code> and <code>height</code> size an element. The unit you choose changes the behaviour: <code>px</code> is a fixed size, while <code>%</code> is a share of the <b>parent's</b> size (so <code>width: 50%</code> is half the container).<br><br>Two extremely useful ones: <code>max-width</code> lets a box shrink on small screens but stops it getting too wide on big ones, this is how you keep lines of text at a readable length. <code>min-height</code> sets a floor so a box never collapses smaller than you want. Note that setting <code>height</code> on text is usually a mistake; let it grow naturally and control spacing with padding instead.", "code": "<style>\n  .half { width: 50%; background: #efeaff; padding: 10px; margin-bottom: 8px; }\n  .fixed { width: 150px; height: 70px; background: #6d5cf6; color: white; padding: 10px; margin-bottom: 8px; }\n  .readable { max-width: 300px; background: #fef3c7; padding: 10px; }\n</style>\n<div class=\"half\">50% of the parent</div>\n<div class=\"fixed\">150 x 70</div>\n<div class=\"readable\">max-width keeps a line of text from getting too long to read comfortably.</div>"}, {"kind": "lesson", "title": "9 · Display", "level": "Beginner", "type": "html", "explain": "The <code>display</code> property decides how an element flows on the page. Remember block vs inline from yesterday's <code>div</code> and <code>span</code>? This is the property behind it.<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 470 250\" width=\"100%\" style=\"max-width:450px\"><text x=\"8\" y=\"18\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">block &#8594; own line, full width</text><rect x=\"8\" y=\"26\" width=\"454\" height=\"26\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\"/><rect x=\"8\" y=\"56\" width=\"454\" height=\"26\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\"/><text x=\"8\" y=\"112\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">inline &#8594; sits in the text, no width/height</text><rect x=\"8\" y=\"120\" width=\"70\" height=\"22\" fill=\"#fde68a\"/><rect x=\"82\" y=\"120\" width=\"90\" height=\"22\" fill=\"#fde68a\"/><rect x=\"176\" y=\"120\" width=\"60\" height=\"22\" fill=\"#fde68a\"/><text x=\"8\" y=\"182\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">inline-block &#8594; in a line, but accepts size</text><rect x=\"8\" y=\"190\" width=\"80\" height=\"46\" fill=\"#c7f9cc\" stroke=\"#15803d\"/><rect x=\"96\" y=\"190\" width=\"80\" height=\"46\" fill=\"#c7f9cc\" stroke=\"#15803d\"/><rect x=\"184\" y=\"190\" width=\"80\" height=\"46\" fill=\"#c7f9cc\" stroke=\"#15803d\"/></svg></div>&bull; <code>block</code> (like <code>div</code>, <code>p</code>, <code>h1</code>): starts on a new line, takes the full width.<br>&bull; <code>inline</code> (like <code>span</code>, <code>a</code>): sits inside a line of text and <b>ignores</b> width and height.<br>&bull; <code>inline-block</code>: flows inline like text, but <b>accepts</b> width, height, and padding, great for buttons and nav items.<br>&bull; <code>none</code>: removes the element completely (invisible, takes no space).", "code": "<style>\n  span { background: #fde68a; }\n  .ib { display: inline-block; width: 90px; background: #c7f9cc; text-align: center; }\n  .hidden { display: none; }\n</style>\n<span>inline</span> <span>inline</span>\n<div><span class=\"ib\">inline-block</span><span class=\"ib\">sized</span></div>\n<p class=\"hidden\">You can't see me.</p>\n<p>The hidden paragraph above takes no space.</p>"}]}, {"day": "TEXT & FONTS", "items": [{"kind": "lesson", "title": "10 · Text styling", "level": "Beginner", "type": "html", "explain": "A group of properties shape how text looks:<br><br>&bull; <code>text-align</code>: <code>left</code>, <code>center</code>, or <code>right</code><br>&bull; <code>text-decoration</code>: <code>underline</code>, or <code>none</code> to <b>remove</b> the underline links have by default<br>&bull; <code>text-transform</code>: <code>uppercase</code>, <code>lowercase</code>, or <code>capitalize</code><br>&bull; <code>line-height</code>: the vertical space between lines, 1.5 to 1.8 makes paragraphs much easier to read<br>&bull; <code>letter-spacing</code>: space between characters, nice for headings<br><br>The example combines several. Try changing <code>uppercase</code> to <code>capitalize</code>, or the line-height number.", "code": "<style>\n  .title { text-align: center; text-transform: uppercase; letter-spacing: 2px; color: #6d5cf6; }\n  .body { line-height: 1.8; }\n  a { text-decoration: none; color: #6d5cf6; }\n</style>\n<h2 class=\"title\">centered &amp; uppercased</h2>\n<p class=\"body\">Line height controls the space between lines. Higher values make paragraphs easier to read.</p>\n<a href=\"#\">A link with no underline</a>"}, {"kind": "lesson", "title": "11 · Fonts", "level": "Beginner", "type": "html", "explain": "<code>font-family</code> sets the typeface. Always list <b>fallbacks</b> ending in a generic family, like <code>font-family: Arial, sans-serif</code>, so if the first font isn't available the browser uses the next. The three generic families are <b>sans-serif</b> (clean, modern), <b>serif</b> (classic, with little feet on letters), and <b>monospace</b> (every character the same width, used for code).<br><br>Then <code>font-size</code> sets the size, <code>font-weight</code> the thickness (<code>400</code> normal, <code>700</code> bold), and <code>font-style: italic</code> slants it. For custom fonts, real projects add a Google Fonts <code>&lt;link&gt;</code> in the head, we'll do that in Project 1.", "code": "<style>\n  .sans { font-family: Arial, sans-serif; }\n  .serif { font-family: Georgia, serif; }\n  .mono { font-family: \"Courier New\", monospace; }\n  .big { font-size: 28px; font-weight: 700; }\n</style>\n<p class=\"sans\">Sans-serif (clean, modern)</p>\n<p class=\"serif\">Serif (classic, bookish)</p>\n<p class=\"mono\">Monospace (code)</p>\n<p class=\"big\">Big and bold</p>"}]}, {"day": "LAYOUT", "items": [{"kind": "lesson", "title": "12 · Position: relative & absolute", "level": "Intermediate", "type": "html", "explain": "<p>Normally the browser stacks your elements top-to-bottom in the order you wrote them, the <b>normal flow</b>. <code>position</code> is how you <b>break out</b> of that flow when you need to place something exactly.</p><p><b><code>static</code></b> &mdash; the default. The box sits in the normal flow. Key detail: <code>top</code>, <code>left</code>, <code>right</code>, <code>bottom</code> <b>do nothing</b> on a static element. If you set <code>top: 20px</code> and nothing happens, this is why.</p><p><b><code>relative</code></b> &mdash; the box is nudged <b>from its own normal spot</b> using <code>top</code>/<code>left</code>. It moves only <i>visually</i>: <b>its original space stays reserved</b>, so neighbours don't shift.</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 190\" width=\"100%\" style=\"max-width:440px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">position: relative  =  nudged, but its space stays</text><rect x=\"20\" y=\"35\" width=\"180\" height=\"40\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"55\" y=\"60\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">box 1 (static)</text><rect x=\"20\" y=\"85\" width=\"180\" height=\"40\" fill=\"none\" stroke=\"#a5a4b8\" stroke-dasharray=\"5\"/><text x=\"34\" y=\"110\" font-size=\"11\" fill=\"#8a8a98\" font-family=\"monospace\">original spot (kept!)</text><rect x=\"70\" y=\"100\" width=\"180\" height=\"40\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\" stroke-width=\"2\"/><text x=\"88\" y=\"125\" font-size=\"12\" fill=\"#4338ca\" font-family=\"monospace\">box 2: relative</text><text x=\"262\" y=\"112\" font-size=\"11\" fill=\"#6d5cf6\" font-family=\"monospace\">top:15px; left:50px</text><rect x=\"20\" y=\"135\" width=\"180\" height=\"40\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"55\" y=\"160\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">box 3 (static)</text></svg><div style=\"font-size:.72rem;color:#8a8a98;margin-top:6px\">Box 3 does not move up. The page still reserves box 2&#8217;s original space.</div><p>Honestly, you'll rarely nudge things this way. <code>relative</code>'s real job comes next.</p><p><b><code>absolute</code></b> &mdash; the box is <b>removed from the flow entirely</b> (siblings close the gap), then placed with <code>top</code>/<code>right</code>/etc. measured from the edges of <b>the nearest parent that has a position value</b>. No positioned parent? It measures from the whole page, almost never what you want.</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 210\" width=\"100%\" style=\"max-width:440px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">position: absolute  =  lifted out, pinned to the parent</text><rect x=\"20\" y=\"32\" width=\"420\" height=\"165\" fill=\"#f4f4fa\" stroke=\"#6d5cf6\" stroke-dasharray=\"6\" rx=\"8\"/><text x=\"32\" y=\"52\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">parent (position: relative)</text><rect x=\"40\" y=\"65\" width=\"180\" height=\"40\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"76\" y=\"90\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">box 1 (static)</text><rect x=\"40\" y=\"115\" width=\"180\" height=\"40\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"76\" y=\"140\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">box 3 (static)</text><text x=\"40\" y=\"180\" font-size=\"10.5\" fill=\"#8a8a98\" font-family=\"monospace\">box 3 moved up: box 2 leaves NO gap</text><rect x=\"330\" y=\"45\" width=\"95\" height=\"38\" fill=\"#ef4444\" rx=\"4\"/><text x=\"343\" y=\"68\" font-size=\"11\" fill=\"#fff\" font-family=\"monospace\">box 2: abs</text><text x=\"292\" y=\"100\" font-size=\"10.5\" fill=\"#b91c1c\" font-family=\"monospace\">top: 12px; right: 14px</text></svg><div style=\"font-size:.72rem;color:#8a8a98;margin-top:6px\">Absolute takes the box out of the normal stack and measures it from the parent&#8217;s edges.</div><p><b>The recipe to memorise</b>, they always travel together:</p><p><code>.parent&nbsp;{ position: relative; }</code> &nbsp;&larr; \"measure from me\"<br><code>.child&nbsp;&nbsp;{ position: absolute; top: 8px; right: 8px; }</code> &nbsp;&larr; \"pin me to that corner\"</p><p>The parent's <code>relative</code> usually has no top/left at all, it isn't there to move; it's there to say \"absolute children measure from me.\"</p><p><b>In short:</b> relative = relative to <b>itself</b> (its old spot). Absolute = placed anywhere inside its <b>positioned parent</b>.</p>", "code": "<style>\n  .demo { border: 1px dashed #aaa; padding: 10px; margin-bottom: 18px; }\n  .label { font-size: 12px; color: #888; margin: 0 0 6px; }\n\n  /* RELATIVE: nudged from its own spot, space stays */\n  .box { background: #dcfce7; border: 1px solid #15803d; padding: 8px; }\n  .nudged {\n    position: relative;\n    top: 10px;\n    left: 40px;\n    background: #e0e7ff;\n    border-color: #6d5cf6;\n  }\n\n  /* ABSOLUTE: pinned to the corner of a relative parent */\n  .card {\n    position: relative;          /* \"measure from me\" */\n    background: #efeaff;\n    padding: 30px;\n    border-radius: 10px;\n  }\n  .badge {\n    position: absolute;          /* \"pin me\" */\n    top: 8px;\n    right: 8px;\n    background: #ef4444;\n    color: white;\n    padding: 3px 10px;\n    border-radius: 999px;\n    font-size: 12px;\n  }\n</style>\n\n<div class=\"demo\">\n  <p class=\"label\">relative (nudged, gap stays)</p>\n  <div class=\"box\">box 1</div>\n  <div class=\"box nudged\">box 2: relative, top:10 left:40</div>\n  <div class=\"box\">box 3 (didn't move up!)</div>\n</div>\n\n<div class=\"demo\">\n  <p class=\"label\">absolute inside relative</p>\n  <div class=\"card\">\n    <span class=\"badge\">NEW</span>\n    Delete position:relative from .card and watch the badge fly away.\n  </div>\n</div>", "gotcha": "<code>top/left</code> do nothing on static elements, and an absolute child with no positioned parent measures from the whole page. Try it: delete <code>position: relative</code> from <code>.card</code>, run, and watch the badge jump to the pane corner."}, {"kind": "lesson", "title": "13 · Fixed & z-index", "level": "Intermediate", "type": "html", "explain": "<p>Two more tools finish the positioning story: one for pinning to the <b>screen</b>, one for deciding <b>who's on top</b>.</p><p><b><code>fixed</code></b> &mdash; like absolute, but measured from the <b>screen itself</b>, so the element stays put while the page scrolls. This is how floating chat buttons, cookie banners and sticky navbars work. In the example, scroll the result pane and watch the dark button hold its corner.</p><p><b><code>z-index</code></b> &mdash; once elements can overlap (which positioning makes possible), <code>z-index</code> decides the stacking order.</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 150\" width=\"100%\" style=\"max-width:440px\"><text x=\"12\" y=\"20\" font-size=\"12\" fill=\"#1b1b28\" font-family=\"monospace\">z-index  =  who sits on top when boxes overlap</text><rect x=\"60\" y=\"40\" width=\"150\" height=\"80\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"80\" y=\"85\" font-size=\"12\" fill=\"#15803d\" font-family=\"monospace\">z-index: 1</text><rect x=\"150\" y=\"60\" width=\"150\" height=\"80\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"172\" y=\"105\" font-size=\"12\" fill=\"#fff\" font-family=\"monospace\">z-index: 2</text></svg><div style=\"font-size:.72rem;color:#8a8a98;margin-top:6px\">Higher number = in front. Both boxes need a position value for z-index to apply.</div><p>Two rules cover 99% of cases:</p><p>1. <b>Higher number sits in front.</b> The values don't need to be sequential, <code>1, 2, 3</code> and <code>5, 50, 500</code> behave the same.<br>2. <b>It only works on positioned elements</b> (anything except static). \"My z-index does nothing\" almost always means the element is still static, add <code>position: relative</code> and it obeys.</p><p>In the example the three cards overlap like fanned playing cards: green (1) at the back, red (3) in front. Change the numbers and rerun to reshuffle the stack.</p>", "code": "<style>\n  .demo { border: 1px dashed #aaa; padding: 10px; margin-bottom: 18px; }\n  .label { font-size: 12px; color: #888; margin: 0 0 6px; }\n\n  /* Z-INDEX: overlapping cards, higher number wins */\n  .stack { position: relative; height: 120px; }\n  .layer {\n    position: absolute;\n    width: 130px;\n    height: 75px;\n    border-radius: 8px;\n    color: white;\n    padding: 6px;\n    font-size: 12px;\n  }\n  .l1 { background: #15803d; top: 0;    left: 0;    z-index: 1; }\n  .l2 { background: #6d5cf6; top: 20px; left: 65px;  z-index: 2; }\n  .l3 { background: #ef4444; top: 40px; left: 130px; z-index: 3; }\n\n  /* FIXED: stays put while this pane scrolls */\n  .float-btn {\n    position: fixed;\n    bottom: 10px;\n    right: 10px;\n    background: #1b1b28;\n    color: white;\n    padding: 8px 14px;\n    border-radius: 999px;\n    font-size: 12px;\n  }\n</style>\n\n<div class=\"demo\">\n  <p class=\"label\">z-index (change the numbers!)</p>\n  <div class=\"stack\">\n    <div class=\"layer l1\">z-index: 1</div>\n    <div class=\"layer l2\">z-index: 2</div>\n    <div class=\"layer l3\">z-index: 3</div>\n  </div>\n</div>\n\n<p>Scroll this pane: the dark button stays fixed in its corner.</p>\n<p style=\"height:220px\"></p>\n<p>Still scrolling...</p>\n<p style=\"height:220px\"></p>\n<div class=\"float-btn\">position: fixed</div>", "gotcha": "<code>z-index</code> is ignored on static elements. Experiment: give <code>.l1</code> a <code>z-index: 10</code>, the green card jumps to the front of the stack."}, {"kind": "lesson", "title": "14 · Overflow", "level": "Intermediate", "type": "html", "explain": "Sometimes content is bigger than the box holding it, a long list in a short container, for example. <code>overflow</code> decides what happens:<br><br>&bull; <code>visible</code> &mdash; the content spills out past the box (the default)<br>&bull; <code>hidden</code> &mdash; the extra content is clipped and hidden<br>&bull; <code>scroll</code> &mdash; scrollbars always appear<br>&bull; <code>auto</code> &mdash; scrollbars appear <b>only</b> when needed (usually what you want)<br><br>In the example the box is deliberately too short for its text, so <code>overflow: auto</code> gives it a scrollbar. Change it to <code>hidden</code> to see the text simply cut off.", "code": "<style>\n  .box { height: 90px; width: 260px; border: 1px solid #6d5cf6; padding: 10px; overflow: auto; }\n</style>\n<div class=\"box\">\n  This box is short but has lots of text.<br>\n  Line 2<br>Line 3<br>Line 4<br>Line 5<br>Line 6<br>Line 7\n</div>"}, {"kind": "lesson", "title": "15 · Flexbox", "level": "Intermediate", "type": "html", "explain": "<p>Before flexbox, the problem was always this: you have a handful of boxes and you want them <b>side by side, evenly spaced, and lined up</b>, and normal flow only knows how to stack things top-to-bottom. Flexbox solves exactly that.</p><p><b>Step 1 &mdash; know who's who.</b> Flexbox always involves two roles: the <b>container</b> (the parent box) and the <b>items</b> (its direct children). This is the part that trips everyone: <b>you write the flex rules on the container, not on the items.</b> The items just obey.</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 170\" width=\"100%\" style=\"max-width:440px\"><rect x=\"20\" y=\"30\" width=\"420\" height=\"110\" fill=\"#efeaff\" stroke=\"#6d5cf6\" stroke-width=\"2\" rx=\"8\"/><text x=\"30\" y=\"22\" font-size=\"12\" fill=\"#4338ca\" font-family=\"monospace\">the CONTAINER gets display:flex (rules go HERE)</text><rect x=\"45\" y=\"55\" width=\"90\" height=\"60\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"150\" y=\"55\" width=\"90\" height=\"60\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"255\" y=\"55\" width=\"90\" height=\"60\" fill=\"#6d5cf6\" rx=\"6\"/><text x=\"72\" y=\"90\" font-size=\"11\" fill=\"#fff\" font-family=\"monospace\">item</text><text x=\"177\" y=\"90\" font-size=\"11\" fill=\"#fff\" font-family=\"monospace\">item</text><text x=\"282\" y=\"90\" font-size=\"11\" fill=\"#fff\" font-family=\"monospace\">item</text><text x=\"30\" y=\"160\" font-size=\"11\" fill=\"#8a8a98\" font-family=\"monospace\">the children become items automatically, no code needed on them</text></svg></div><p><b>Step 2 &mdash; <code>display: flex</code>.</b> Put it on the container and one thing happens immediately: the children stop stacking and line up <b>in a row</b>. That's the whole entry ticket.</p><p><b>Step 3 &mdash; space them along the row with <code>justify-content</code>.</b> This controls the <b>left&#8596;right</b> spacing. There are really only four values you'll use, and they're easiest to just see:</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 260\" width=\"100%\" style=\"max-width:440px\"><rect x=\"20\" y=\"22\" width=\"420\" height=\"34\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><rect x=\"26\" y=\"27\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"72\" y=\"27\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"118\" y=\"27\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"20\" y=\"16\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">justify-content: flex-start (default)</text><rect x=\"20\" y=\"86\" width=\"420\" height=\"34\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><rect x=\"166\" y=\"91\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"212\" y=\"91\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"258\" y=\"91\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"20\" y=\"80\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">justify-content: center</text><rect x=\"20\" y=\"150\" width=\"420\" height=\"34\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><rect x=\"26\" y=\"155\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"210\" y=\"155\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"394\" y=\"155\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"20\" y=\"144\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">justify-content: space-between</text><rect x=\"20\" y=\"214\" width=\"420\" height=\"34\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><rect x=\"68\" y=\"219\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"210\" y=\"219\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"352\" y=\"219\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"20\" y=\"208\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">justify-content: space-around</text></svg><div style=\"font-size:.72rem;color:#8a8a98;margin-top:6px\">Same three items, different spacing along the row.</div></div><p><code>space-between</code> is the star: first and last item touch the edges, leftover space goes evenly between, which is exactly a navbar (logo left, links right).</p><p><b>Step 4 &mdash; line them up vertically with <code>align-items</code>.</b> If the container is taller than the items, this decides where they sit <b>up&#8595;down</b>: <code>flex-start</code> (top), <code>center</code> (middle), or <code>stretch</code> (fill the height).</p><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 170\" width=\"100%\" style=\"max-width:440px\"><rect x=\"20\" y=\"25\" width=\"195\" height=\"120\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><text x=\"20\" y=\"17\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">align-items: flex-start</text><rect x=\"35\" y=\"35\" width=\"40\" height=\"30\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"85\" y=\"35\" width=\"40\" height=\"45\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"135\" y=\"35\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"245\" y=\"25\" width=\"195\" height=\"120\" fill=\"#f4f4fa\" stroke=\"#d8d8e2\" rx=\"5\"/><text x=\"245\" y=\"17\" font-size=\"11\" fill=\"#4338ca\" font-family=\"monospace\">align-items: center</text><rect x=\"260\" y=\"70\" width=\"40\" height=\"30\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"310\" y=\"63\" width=\"40\" height=\"45\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"360\" y=\"73\" width=\"40\" height=\"24\" fill=\"#6d5cf6\" rx=\"4\"/></svg><div style=\"font-size:.72rem;color:#8a8a98;margin-top:6px\">align-items moves the items up and down inside the container&#8217;s height.</div></div><p><b>Step 5 &mdash; <code>gap</code>.</b> One property for even spacing <i>between</i> items: <code>gap: 12px</code>. Before this existed people fought with margins; you don't have to.</p><p>So the mental model in one line each:<br><code>display: flex</code> &rarr; children form a row<br><code>justify-content</code> &rarr; spacing along the row (left&#8596;right)<br><code>align-items</code> &rarr; position across the row (up&#8595;down)<br><code>gap</code> &rarr; space between items</p><p><b>And the famous centering trick:</b> to put one thing dead-centre in a box, both directions, make the box a flex container and centre both axes:</p><div style='font-family:monospace;font-size:.9rem;background:#1e1e2e;color:#e6e6f0;padding:12px;border-radius:8px;margin:8px 0'>.parent {<br>&nbsp;&nbsp;display: flex;<br>&nbsp;&nbsp;justify-content: center;&nbsp;&nbsp;/* left-right */<br>&nbsp;&nbsp;align-items: center;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;/* up-down */<br>}</div><p>That's the second demo in the example. Memorise the trio, you'll type it hundreds of times.</p><p><b>Try it:</b> in the first demo, change <code>space-between</code> to <code>center</code>, then <code>space-around</code>, then <code>flex-end</code>, and watch the boxes move. Then delete <code>display: flex</code> entirely and watch them collapse back into a vertical stack, that's the before/after that makes it click.</p>", "code": "<style>\n  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #efeaff; padding: 12px; }\n  .item { background: #6d5cf6; color: white; padding: 16px; border-radius: 8px; }\n  .center { display: flex; justify-content: center; align-items: center; height: 90px; background: #fef3c7; margin-top: 10px; }\n</style>\n<div class=\"row\"><div class=\"item\">1</div><div class=\"item\">2</div><div class=\"item\">3</div></div>\n<div class=\"center\"><div class=\"item\">perfectly centered</div></div>", "gotcha": "To centre anything: <code>display:flex; justify-content:center; align-items:center;</code> on the parent. Memorise this trio."}, {"kind": "lesson", "title": "16 · Grid", "level": "Intermediate", "type": "html", "explain": "If flexbox is a single <b>line</b> of items, grid is a <b>table you define</b>. One sentence: <b><code>display: grid</code> plus <code>grid-template-columns</code> lets you say how many columns you want, and the children fill them in.</b><div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 180\" width=\"100%\" style=\"max-width:440px\"><text x=\"8\" y=\"22\" font-size=\"12\" fill=\"#6a6a7d\" font-family=\"monospace\">grid-template-columns: 1fr 1fr 1fr;  (3 columns)</text><rect x=\"20\" y=\"40\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"165\" y=\"40\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"310\" y=\"40\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"20\" y=\"110\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"165\" y=\"110\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/><rect x=\"310\" y=\"110\" width=\"130\" height=\"55\" fill=\"#6d5cf6\" rx=\"6\"/></svg></div><code>grid-template-columns: 1fr 1fr 1fr</code> means three equal columns, where <code>fr</code> means \"one share of the space.\" Items flow in left-to-right and wrap to the next row automatically. Change it to <code>1fr 1fr</code> for two columns, or <code>2fr 1fr</code> to make the first column twice as wide. <code>gap</code> spaces the cells.<br><br><b>Flex vs grid, in one line:</b> flexbox for a row of things, grid when you need real rows <b>and</b> columns (a photo gallery, a dashboard).", "code": "<style>\n  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }\n  .cell { background: #6d5cf6; color: white; padding: 20px; text-align: center; border-radius: 8px; }\n</style>\n<div class=\"grid\">\n  <div class=\"cell\">1</div><div class=\"cell\">2</div><div class=\"cell\">3</div>\n  <div class=\"cell\">4</div><div class=\"cell\">5</div><div class=\"cell\">6</div>\n</div>", "optional": true}, {"kind": "lesson", "title": "17 · Responsive & media queries", "level": "Intermediate", "type": "html", "explain": "The problem: a layout that looks great on a laptop looks cramped on a phone. The fix is a <b>media query</b>, which is just an <b>\"only when the screen is this size\"</b> wrapper around some CSS.<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 470 180\" width=\"100%\" style=\"max-width:450px\"><text x=\"10\" y=\"18\" font-size=\"11\" fill=\"#6a6a7d\" font-family=\"monospace\">wide screen &#8594; a row</text><rect x=\"10\" y=\"26\" width=\"250\" height=\"120\" fill=\"#f7f6fb\" stroke=\"#6d5cf6\" rx=\"6\"/><rect x=\"22\" y=\"60\" width=\"65\" height=\"50\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"97\" y=\"60\" width=\"65\" height=\"50\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"172\" y=\"60\" width=\"65\" height=\"50\" fill=\"#6d5cf6\" rx=\"4\"/><text x=\"300\" y=\"18\" font-size=\"11\" fill=\"#6a6a7d\" font-family=\"monospace\">narrow &#8594; stacked</text><rect x=\"310\" y=\"26\" width=\"90\" height=\"145\" fill=\"#f7f6fb\" stroke=\"#6d5cf6\" rx=\"6\"/><rect x=\"322\" y=\"38\" width=\"66\" height=\"34\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"322\" y=\"80\" width=\"66\" height=\"34\" fill=\"#6d5cf6\" rx=\"4\"/><rect x=\"322\" y=\"122\" width=\"66\" height=\"34\" fill=\"#6d5cf6\" rx=\"4\"/></svg></div>Here's the whole idea in one block:<br><div style='font-family:monospace;font-size:.9rem;background:#1e1e2e;color:#e6e6f0;padding:12px;border-radius:8px;margin:8px 0'>@media (max-width: 500px) {<br>&nbsp;&nbsp;.row { flex-direction: column; }<br>}</div>Read it literally: \"<b>when the screen is 500px wide or less</b>, stack the row into a column.\" That's all a media query is, a conditional for CSS based on screen width. The size where the layout changes (500px here) is called a <b>breakpoint</b>. Drag the result pane narrow to watch the row of boxes become a stack.", "code": "<style>\n  .row { display: flex; gap: 10px; }\n  .item { flex: 1; background: #6d5cf6; color: white; padding: 20px; text-align: center; border-radius: 8px; }\n  @media (max-width: 500px) {\n    .row { flex-direction: column; }\n  }\n</style>\n<div class=\"row\"><div class=\"item\">A</div><div class=\"item\">B</div><div class=\"item\">C</div></div>"}]}, {"day": "SELECTORS & MORE", "items": [{"kind": "lesson", "title": "18 · Combinators & attribute selectors", "level": "Intermediate", "type": "html", "explain": "Combinators let you select elements by their <b>relationship</b> to others, so you can target precisely without adding a class to everything.<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 210\" width=\"100%\" style=\"max-width:440px\"><rect x=\"170\" y=\"10\" width=\"120\" height=\"34\" fill=\"#6d5cf6\" rx=\"6\"/><text x=\"195\" y=\"32\" font-size=\"13\" fill=\"#fff\" font-family=\"monospace\">div.box</text><line x1=\"230\" y1=\"44\" x2=\"120\" y2=\"80\" stroke=\"#a5a4b8\"/><line x1=\"230\" y1=\"44\" x2=\"340\" y2=\"80\" stroke=\"#a5a4b8\"/><rect x=\"70\" y=\"80\" width=\"100\" height=\"34\" fill=\"#dcfce7\" stroke=\"#15803d\" rx=\"6\"/><text x=\"95\" y=\"102\" font-size=\"13\" fill=\"#15803d\" font-family=\"monospace\">p</text><rect x=\"300\" y=\"80\" width=\"90\" height=\"34\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\" rx=\"6\"/><text x=\"332\" y=\"102\" font-size=\"13\" fill=\"#4338ca\" font-family=\"monospace\">div</text><line x1=\"345\" y1=\"114\" x2=\"345\" y2=\"150\" stroke=\"#a5a4b8\"/><rect x=\"300\" y=\"150\" width=\"100\" height=\"34\" fill=\"#fde68a\" rx=\"6\"/><text x=\"325\" y=\"172\" font-size=\"13\" fill=\"#92400e\" font-family=\"monospace\">p</text><text x=\"20\" y=\"135\" font-size=\"11\" fill=\"#15803d\" font-family=\"monospace\">.box &gt; p hits the green p only</text><text x=\"20\" y=\"200\" font-size=\"11\" fill=\"#92400e\" font-family=\"monospace\">.box p (space) hits BOTH p tags</text></svg></div>Think of your HTML as a family tree: a <code>div</code> can contain <code>p</code> tags, those can contain more tags, and tags sitting side by side are siblings. The symbol you put <b>between two selectors</b> says which family relationship you mean.<ul><li><b>space</b> = <i>inside</i>. <code>.box p</code> means \"every <code>p</code> anywhere inside <code>.box</code>\", children, grandchildren, any depth. This is the <b>descendant</b> selector.</li><li><b><code>&gt;</code></b> = <i>directly inside</i>. <code>.box &gt; p</code> means \"only the <code>p</code> tags that are immediate children of <code>.box</code>\". A <code>p</code> wrapped in another <code>div</code> is skipped.</li><li><b><code>+</code></b> = <i>the next one</i>. <code>h2 + p</code> means \"the single <code>p</code> that comes straight after an <code>h2</code>\". Useful for spacing the first paragraph under a heading.</li><li><b><code>~</code></b> = <i>all the later ones</i>. <code>h2 ~ p</code> means \"every <code>p</code> that comes after an <code>h2</code> at the same level\".</li></ul>Look back at the diagram: <code>.box p</code> catches <b>both</b> the green and the yellow <code>p</code>, while <code>.box &gt; p</code> catches only the green one, because the yellow one sits one level deeper. The space and <code>&gt;</code> are the two you will actually use most.<br><br><b>Attribute selectors</b> are just as simple: <b>match an element by what is written inside its tag</b>. So far you can select by tag name (<code>p</code>), class (<code>.box</code>) and id (<code>#top</code>). Square brackets add \"any attribute at all\":<ul><li><code>input[type=\"email\"]</code> &mdash; inputs whose <code>type</code> is exactly <code>email</code>.</li><li><code>[disabled]</code> &mdash; anything that simply <b>has</b> a <code>disabled</code> attribute, no value needed.</li><li><code>a[href^=\"https\"]</code> &mdash; <code>^=</code> means \"starts with\", so secure links only.</li><li><code>a[href$=\".pdf\"]</code> &mdash; <code>$=</code> means \"ends with\", handy for adding an icon to PDF links.</li></ul>These matter most in <b>forms</b>, where every field is the same <code>input</code> tag and the <code>type</code> attribute is the only thing telling a text box apart from an email box or a checkbox.", "code": "<style>\n  .box > p { color: #6d5cf6; font-weight: bold; }\n  input[type=\"email\"] { border: 2px solid green; }\n</style>\n<div class=\"box\">\n  <p>Direct child (purple)</p>\n  <div><p>Deeper child (normal)</p></div>\n</div>\n<input type=\"text\" placeholder=\"text\">\n<input type=\"email\" placeholder=\"email\">", "optional": true}, {"kind": "lesson", "title": "19 · Pseudo-classes", "level": "Intermediate", "type": "html", "explain": "A pseudo-class styles an element in a particular <b>state</b> or <b>position</b>, using a single colon:<br><br>&bull; <code>:hover</code> &mdash; while the mouse is over it (the classic button effect)<br>&bull; <code>:focus</code> &mdash; while an input is selected (important for accessibility)<br>&bull; <code>:first-child</code> / <code>:last-child</code> &mdash; the first or last item in a group<br>&bull; <code>:nth-child(even)</code> &mdash; every even item, the trick behind zebra-striped lists and tables<br><br>Hover the button, click the input, and notice the alternating row colours, all done without touching the HTML.", "code": "<style>\n  button { background: #6d5cf6; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; }\n  button:hover { background: #4f46e5; }\n  input:focus { outline: 2px solid #6d5cf6; }\n  li { padding: 6px; list-style: none; }\n  li:nth-child(even) { background: #efeaff; }\n</style>\n<button>Hover me</button>\n<input placeholder=\"Click me\">\n<ul><li>Row 1</li><li>Row 2</li><li>Row 3</li><li>Row 4</li></ul>"}, {"kind": "lesson", "title": "20 · Pseudo-elements", "level": "Intermediate", "type": "html", "explain": "Pseudo-elements use a <b>double</b> colon and let you style or insert a piece of an element that isn't in your HTML. The two you'll use are <code>::before</code> (adds content at the start) and <code>::after</code> (adds content at the end).<br><br>The key is the <code>content</code> property, which holds the text or symbol to insert. In the example, <code>::before</code> adds a <code>#</code> in front of a tag and <code>::after</code> adds a currency label after a price, decorations added purely with CSS, no extra markup. These power tooltips, icons, and clever badges.", "code": "<style>\n  .tag::before { content: \"# \"; color: #6d5cf6; }\n  .price::after { content: \" NPR\"; color: gray; font-size: 0.8em; }\n</style>\n<p class=\"tag\">webdev</p>\n<p class=\"price\">500</p>", "optional": true}, {"kind": "lesson", "title": "21 · Units", "level": "Intermediate", "type": "html", "explain": "The unit you choose decides how a size behaves:<br><br>&bull; <code>px</code> &mdash; a fixed pixel, always the same size<br>&bull; <code>%</code> &mdash; relative to the <b>parent</b> element<br>&bull; <code>rem</code> &mdash; relative to the page's base font size (usually 16px). Best for text and spacing, because it scales cleanly.<br>&bull; <code>em</code> &mdash; relative to the element's <b>own</b> font size (can compound, so use carefully)<br>&bull; <code>vw</code> / <code>vh</code> &mdash; 1% of the screen's width / height, great for full-screen sections<br><br>A good habit: <code>rem</code> for fonts and spacing, <code>%</code> or <code>fr</code> for layout widths, <code>px</code> for small fixed things like borders.", "code": "<style>\n  .a { width: 150px; background: #efeaff; }\n  .b { width: 50%; background: #fde68a; }\n  .c { width: 40vw; background: #c7f9cc; }\n  div { padding: 8px; margin: 4px 0; }\n</style>\n<div class=\"a\">150px fixed</div>\n<div class=\"b\">50% of parent</div>\n<div class=\"c\">40vw of screen - resize me</div>"}, {"kind": "lesson", "title": "22 · Specificity & the cascade", "level": "Intermediate", "type": "html", "explain": "When two rules set the same property on the same element, which one wins? The browser picks the <b>more specific</b> selector. Specificity has a rough scoring: an id is worth far more than a class, which is worth more than a tag.<div style=\"margin:14px 0;background:#faf9ff;border:1px solid #e7e5f0;border-radius:10px;padding:14px;text-align:center\"><svg viewBox=\"0 0 460 200\" width=\"100%\" style=\"max-width:440px\"><rect x=\"20\" y=\"150\" width=\"90\" height=\"30\" fill=\"#dcfce7\" stroke=\"#15803d\"/><text x=\"30\" y=\"170\" font-size=\"11\" font-family=\"monospace\" fill=\"#15803d\">tag  (1)</text><rect x=\"120\" y=\"115\" width=\"90\" height=\"65\" fill=\"#e0e7ff\" stroke=\"#6d5cf6\"/><text x=\"128\" y=\"135\" font-size=\"11\" font-family=\"monospace\" fill=\"#4338ca\">class (10)</text><rect x=\"220\" y=\"75\" width=\"90\" height=\"105\" fill=\"#ede9fe\" stroke=\"#6d28d9\"/><text x=\"230\" y=\"95\" font-size=\"11\" font-family=\"monospace\" fill=\"#6d28d9\">id  (100)</text><rect x=\"320\" y=\"35\" width=\"110\" height=\"145\" fill=\"#fef3c7\" stroke=\"#f59e0b\"/><text x=\"328\" y=\"55\" font-size=\"11\" font-family=\"monospace\" fill=\"#b45309\">inline (1000)</text><text x=\"20\" y=\"25\" font-size=\"12\" font-family=\"monospace\" fill=\"#1b1b28\">weaker &#8594; stronger (higher wins)</text></svg></div>So <code>#special</code> (id) beats <code>.highlight</code> (class) beats <code>p</code> (tag), no matter the order. If two rules are <b>equally</b> specific, the one written <b>last</b> wins. This is the answer to the most common CSS frustration, \"why isn't my style applying?\", usually a more specific rule is quietly overriding it. Inline styles beat all selectors, and <code>!important</code> overrides everything (which is exactly why you avoid it).", "code": "<style>\n  p { color: gray; }\n  .highlight { color: green; }\n  #special { color: purple; }\n</style>\n<p>Gray (tag)</p>\n<p class=\"highlight\">Green (class beats tag)</p>\n<p class=\"highlight\" id=\"special\">Purple (id beats class)</p>", "gotcha": "Debugging tip: open DevTools (F12), click the element, and the Styles panel shows the winning rule with overridden ones struck through."}]}, {"day": "EFFECTS", "items": [{"kind": "lesson", "title": "23 · Transitions & hover", "level": "Advanced", "type": "html", "explain": "A <code>transition</code> makes a property change <b>animate smoothly</b> instead of snapping instantly. You tell it which property to watch and how long to take: <code>transition: transform 0.3s;</code> means \"whenever <code>transform</code> changes, ease it over 0.3 seconds.\" Use <code>all</code> to animate every change.<br><br>On its own a transition does nothing, it needs a <b>trigger</b>, and the most common trigger is <code>:hover</code>. In the example, hovering the card changes its transform and shadow, and the transition makes that change glide. This subtle motion is what separates a flat page from one that feels polished.", "code": "<style>\n  .card { background: #6d5cf6; color: white; padding: 24px; border-radius: 12px; width: 200px; text-align: center; transition: transform 0.3s, box-shadow 0.3s; }\n  .card:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(109,92,246,0.4); }\n</style>\n<div class=\"card\">Hover me</div>"}, {"kind": "lesson", "title": "24 · Transforms", "level": "Advanced", "type": "html", "explain": "<code>transform</code> visually moves, rotates, or resizes an element <b>without disturbing the layout</b> around it (neighbours don't shift). The common functions:<br><br>&bull; <code>translate(x, y)</code> &mdash; moves it (e.g. <code>translateY(-8px)</code> lifts it up)<br>&bull; <code>scale(1.2)</code> &mdash; grows it to 120%<br>&bull; <code>rotate(45deg)</code> &mdash; spins it<br><br>Because transforms are cheap and smooth to animate, they pair perfectly with <code>transition</code>. Hover each box to see scale and rotate in action. You can even combine them: <code>transform: translateY(-4px) scale(1.05)</code>.", "code": "<style>\n  .row { display: flex; gap: 20px; padding: 20px; }\n  .box { width: 70px; height: 70px; background: #6d5cf6; border-radius: 10px; transition: transform 0.3s; }\n  .s:hover { transform: scale(1.3); }\n  .r:hover { transform: rotate(45deg); }\n</style>\n<div class=\"row\"><div class=\"box s\"></div><div class=\"box r\"></div></div>", "optional": true}, {"kind": "lesson", "title": "25 · Animations", "level": "Advanced", "type": "html", "explain": "A transition animates a single change between two states. For motion that runs <b>on its own</b> and can have many steps or loop forever, you use <code>@keyframes</code> plus the <code>animation</code> property.<br><br><code>@keyframes</code> defines the stages by percentage: <code>0%</code> is the start, <code>100%</code> the end, and you can add any stops between (here <code>50%</code> lifts the ball up, so it rises and falls). You attach it with <code>animation: bounce 1s infinite</code>, the name, how long one cycle takes, and <code>infinite</code> to loop forever. Change <code>1s</code> to <code>0.4s</code> to make it bounce faster.", "code": "<style>\n  @keyframes bounce {\n    0%, 100% { transform: translateY(0); }\n    50% { transform: translateY(-30px); }\n  }\n  .ball { width: 50px; height: 50px; background: #6d5cf6; border-radius: 50%; margin: 30px auto; animation: bounce 1s infinite; }\n</style>\n<div class=\"ball\"></div>", "optional": true}, {"kind": "lesson", "title": "26 · CSS variables", "level": "Advanced", "type": "html", "explain": "Custom properties (CSS variables) let you store a value <b>once</b> and reuse it everywhere. You declare one with a double-dash name, usually on <code>:root</code> (which means the whole page): <code>--brand: #6d5cf6;</code>. Then you read it anywhere with <code>var(--brand)</code>.<br><br>The payoff: change the definition in <b>one</b> place and every element using it updates at once. This is the professional way to keep a consistent colour theme, and it's exactly how a dark-mode toggle works, you just swap the variable values. In the example, both cards read <code>var(--brand)</code>; change that one line at the top and watch both change together.", "code": "<style>\n  :root {\n    --brand: #6d5cf6;\n    --pad: 16px;\n  }\n  .card { background: var(--brand); color: white; padding: var(--pad); border-radius: 8px; margin-bottom: 8px; }\n</style>\n<div class=\"card\">I use var(--brand)</div>\n<div class=\"card\">So do I. Change --brand once, we both update.</div>"}]}, {"day": "DAY 2 · BONUS", "items": [{"kind": "lesson", "title": "⭐ Bonus · Style your portfolio", "level": "Bonus", "type": "html", "explain": "⭐ Time to bring it all together. Here is the portfolio skeleton from yesterday's bonus, now with a starter stylesheet: a colour theme, a flex nav bar, a grid of cards, spacing, and a hover effect, all things you learned today. Read how each rule works, then <b>make it yours</b>: change the colours, fonts and spacing. This is exactly what you'll build on for Project 1.", "code": "<!DOCTYPE html>\n<html>\n<head>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: Arial, sans-serif; color: #1b1b28; }\n  .nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #6d5cf6; }\n  .nav .logo { color: white; font-weight: bold; font-size: 20px; }\n  .nav a { color: white; text-decoration: none; margin-left: 16px; }\n  .nav a:hover { text-decoration: underline; }\n  .hero { text-align: center; padding: 60px 20px; background: #efeaff; }\n  .hero h1 { font-size: 36px; margin-bottom: 8px; }\n  .hero p { color: #6a6a7d; }\n  .section { max-width: 700px; margin: 0 auto; padding: 40px 20px; }\n  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px; }\n  .card { background: #f4f4fa; border-radius: 10px; padding: 20px; text-align: center; transition: transform 0.2s; }\n  .card:hover { transform: translateY(-5px); }\n  footer { text-align: center; padding: 24px; color: #6a6a7d; }\n  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }\n</style>\n</head>\n<body>\n  <div class=\"nav\">\n    <span class=\"logo\">Subal</span>\n    <div>\n      <a href=\"#about\">About</a>\n      <a href=\"#skills\">Skills</a>\n    </div>\n  </div>\n  <section class=\"hero\">\n    <h1>Hi, I'm Subal</h1>\n    <p>A web developer in the making.</p>\n  </section>\n  <section class=\"section\" id=\"skills\">\n    <h2>Skills</h2>\n    <div class=\"cards\">\n      <div class=\"card\"><h3>HTML</h3><p>Structure</p></div>\n      <div class=\"card\"><h3>CSS</h3><p>Style</p></div>\n      <div class=\"card\"><h3>JavaScript</h3><p>Soon</p></div>\n    </div>\n  </section>\n  <footer>Made by Subal &copy; 2026</footer>\n</body>\n</html>", "gotcha": "This is your Project 1 starting point. Change the name, try a new colour theme, add your real skills, then push it to GitHub."}]}];
const flat=[];SEC.forEach(s=>s.items.forEach(it=>flat.push({...it,day:s.day})));
const nav=document.getElementById("nav"),editor=document.getElementById("editor"),output=document.getElementById("output"),
  lessonTitle=document.getElementById("lessonTitle"),lessonBadge=document.getElementById("lessonBadge"),lessonExplain=document.getElementById("lessonExplain"),
  progress=document.getElementById("progress"),workspace=document.getElementById("workspace"),runBtn=document.getElementById("runBtn"),
  resetBtn=document.getElementById("resetBtn"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),runHint=document.getElementById("runHint");
let current=0,debounce=null;
SEC.forEach(s=>{const label=document.createElement("div");label.className="group-label";label.textContent=s.day;nav.appendChild(label);
  s.items.forEach(it=>{const idx=flat.findIndex(f=>f.title===it.title&&f.day===s.day&&f.explain===it.explain);
    const btn=document.createElement("button");btn.className="nav-item"+(it.kind==="info"?" info":"");btn.dataset.idx=idx;
    btn.innerHTML='<i class="dot d-'+it.level+'"></i>'+it.title+(it.optional?' <span class="opt-tag">opt</span>':'');btn.addEventListener("click",()=>load(idx));nav.appendChild(btn);});});
function runHTML(code){
  output.innerHTML="";
  const f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-modals");output.appendChild(f);
  const isFullDoc=/<!doctype|<html[\s>]/i.test(code);
  f.srcdoc=isFullDoc?code:"<style>body{font-family:sans-serif;padding:14px;margin:0;color:#1b1b28;line-height:1.5}</style>"+code;
}
function runCurrent(){const it=flat[current];if(it.type==="html")runHTML(editor.value);}
function load(idx){current=idx;const it=flat[idx];lessonTitle.textContent=it.title;lessonBadge.textContent=it.level;lessonBadge.className="badge-level b-"+it.level;
  let ex=it.explain;if(it.optional)ex='<div class="opt-banner"><b>Optional \u00b7 self-study.</b> Not needed for the projects. Teach briefly if there\u2019s time, or point students here to explore on their own.</div>'+ex;if(it.gotcha)ex+='<div class="gotcha"><b>Gotcha:</b> '+it.gotcha+"</div>";lessonExplain.innerHTML=ex;
  progress.textContent=(idx+1)+" / "+flat.length+"  \u00B7  "+it.day;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",Number(b.dataset.idx)===idx));
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===flat.length-1;
  if(it.kind==="info"){workspace.style.display="none";}else{workspace.style.display="grid";editor.value=it.code;runHint.textContent="updates live as you type";runCurrent();}
  document.querySelector(".content").scrollTop=0;}
editor.addEventListener("input",()=>{if(flat[current].kind==="info")return;clearTimeout(debounce);debounce=setTimeout(runCurrent,350);});
editor.addEventListener("keydown",(e)=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCurrent();}if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);editor.selectionStart=editor.selectionEnd=s+2;}});
runBtn.addEventListener("click",runCurrent);resetBtn.addEventListener("click",()=>{editor.value=flat[current].code;runCurrent();});
prevBtn.addEventListener("click",()=>{if(current>0)load(current-1);});nextBtn.addEventListener("click",()=>{if(current<flat.length-1)load(current+1);});
load(0);
</script></body></html>
